version: 2

# Dependency updates target the development branches, not the release branches.
# A PR raised against a release branch would bypass the dev branch entirely, so the
# update would never appear in any dev build and would land on a release branch that
# is meant to hold released code only. It would also change dependency and lockfile
# entries there, which stops the post-release sync PR merging cleanly.
#
# Every entry sets target-branch explicitly, including the one for the repository's
# default branch, so the target does not silently move if the default ever changes.
updates:
  # LTS 2023
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop-2023"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[develop-2023]"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop-2023"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[develop-2023]"
    groups:
      gha:
        patterns:
          - "*"

  # LTS 2025
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop-2025"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[develop-2025]"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop-2025"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[develop-2025]"
    groups:
      gha:
        patterns:
          - "*"
