name: A11y

on:
  pull_request:
    branches:
      - maintenance-3.1.x

  pull_request_target:
    branches:
      - maintenance-3.1.x
      - lts-2025

  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        default: maintenance-3.1.x
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      REPOSITORY_MANAGER_USERNAME:
        required: true
      REPOSITORY_MANAGER_PASSWORD:
        required: true

permissions:
  contents: read

env:
  REFERENCE_BRANCH: maintenance-3.1.x
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/
  BRANCH_NAME: ${{ github.head_ref || github.event.pull_request.head.ref || inputs.branch }}

jobs:
  a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Set run flag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "workflow_call" ] || ( [ "$GITHUB_EVENT_NAME" = "pull_request_target" ] && [ "$GITHUB_ACTOR" = "dependabot[bot]" ] ); then
            echo "run=true" >> $GITHUB_ENV
          else
            echo "run=false" >> $GITHUB_ENV
          fi

      - name: Debug
        if: env.run == 'true'
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run flag: ${{ env.run }}"

      - uses: catchpoint/workflow-telemetry-action@v2
        if: env.run == 'true'
        with:
          comment_on_pr: false

      - name: Checkout code
        if: env.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Run git config
        if: env.run == 'true'
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - uses: actions/setup-node@v6
        if: env.run == 'true'
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          node-version: 22
          scope: '@nuxeo'

      - uses: actions/setup-java@v5
        if: env.run == 'true'
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Web UI
        if: env.run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm cache clean --force
          npm install
          pushd packages/nuxeo-web-ui-ftest
          npm install
          popd
          pushd packages/nuxeo-designer-catalog
          npm install
          popd

      - name: Update settings.xml with server configuration
        if: env.run == 'true'
        run: |
          echo '<settings>
              <servers>
                <server>
                  <id>maven-internal</id>
                  <username>${{ secrets.REPOSITORY_MANAGER_USERNAME }}</username>
                  <password>${{ secrets.REPOSITORY_MANAGER_PASSWORD }}</password>
                </server>
              </servers>
              </settings>' > ~/.m2/settings.xml

      - name: Web UI build
        if: env.run == 'true'
        run: mvn -B -ntp install

      - name: A11y checks
        if: env.run == 'true'
        run: mvn -B -ntp -f plugin/a11y install