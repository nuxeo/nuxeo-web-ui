name: A11y

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'

  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      REPOSITORY_MANAGER_USERNAME:
        required: true
      REPOSITORY_MANAGER_PASSWORD:
        required: true

env:
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/
  # Branch this PR targets. Used to pick the matching nuxeo-elements branch to build against.
  REFERENCE_BRANCH: ${{ github.base_ref || inputs.branch || github.ref_name }}

jobs:
  a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Debug
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Ref: ${{ github.ref }}"

      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - uses: actions/setup-node@v6
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          node-version: 22
          scope: '@nuxeo'

      - name: Resolve JDK version
        id: jdk
        run: |
          # Derived from the version being built, not the branch name, so it stays correct on
          # dev branches. LTS 2023 (3.1.x) builds on Java 17; 2025 and later on Java 21.
          PACKAGE_VERSION=$(jq -r .version package.json)
          case "$PACKAGE_VERSION" in
            3.1.*)    echo "version=17" >> "$GITHUB_OUTPUT" ;;
            20[0-9][0-9].*) echo "version=21" >> "$GITHUB_OUTPUT" ;;
            *)
              # Explicit rather than defaulting: an unreadable package.json or a version shape
              # nobody has taught this about should stop the build, not silently pick a JDK.
              echo "::error::Cannot derive a JDK version from package.json version '$PACKAGE_VERSION'."
              exit 1
              ;;
          esac

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@314c39e8c2e913db2dc63a31670612ccb2b6e569 # v0.10.4
        with:
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Purge cached Nuxeo artifacts
        run: rm -rf ~/.m2/repository/org/nuxeo

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm ci --ignore-scripts
          pushd packages/nuxeo-web-ui-ftest
          npm ci --ignore-scripts
          popd
          pushd packages/nuxeo-designer-catalog
          npm ci --ignore-scripts
          popd

      # A release build must test the artifact it is about to publish, which takes Elements from
      # the registry via the -rc range in package.json. A pull request must test the Elements
      # branch it is paired with, which exists only as source. Hence the split below.
      - name: Ensure latest @nuxeo RC packages
        if: ${{ github.event_name != 'pull_request' && !startsWith(env.REFERENCE_BRANCH, 'develop-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          ELEMENTS_VERSION=$(
            for pkg in @nuxeo/nuxeo-elements @nuxeo/nuxeo-ui-elements @nuxeo/nuxeo-dataviz-elements @nuxeo/testing-helpers; do
              npm view "$pkg" versions --json | jq -r '.[]'
            done | grep -E "3\.1\.[0-9]+-rc\.[0-9]+$" \
                 | sort | uniq -c | awk '$1 == 4 {print $2}' | sort -V | tail -n1
          )
          echo "Resolved latest nuxeo-elements RC: $ELEMENTS_VERSION"
          if [ -z "$ELEMENTS_VERSION" ]; then
            echo "::error::Could not resolve a common RC version across all @nuxeo packages"
            exit 1
          fi

          npm install \
            @nuxeo/nuxeo-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-ui-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-dataviz-elements@"$ELEMENTS_VERSION" \
            @nuxeo/testing-helpers@"$ELEMENTS_VERSION"

      # Elements is built from the paired branch's source rather than resolved from the registry.
      # The registry lookup only matched `-rc` versions, which are published from the release
      # branches, so on a dev branch it resolved whichever release candidate happened to be newest
      # and never saw that cycle's Elements work. This is the same approach ftest.yaml and
      # cross-repo.yaml already use.
      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and github.head_ref is controlled by whoever
      # opens the pull request - a git ref may legally contain $( ) or backticks.
      - name: Determine nuxeo-elements branch to link
        if: ${{ github.event_name == 'pull_request' || startsWith(env.REFERENCE_BRANCH, 'develop-') }}
        id: pick_nuxeo_elements_branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          # Queried as a full ref: ls-remote matches patterns against the tail of a ref name,
          # so a bare "fix/foo" would also match a branch called "feature/fix/foo" and we would
          # then try to check out a branch that does not exist.
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-elements "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            BRANCH="$HEAD_REF"
          fi
          echo "Pairing with nuxeo-elements branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout the nuxeo-elements repo
        if: ${{ github.event_name == 'pull_request' || startsWith(env.REFERENCE_BRANCH, 'develop-') }}
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Pack Elements modules
        if: ${{ github.event_name == 'pull_request' || startsWith(env.REFERENCE_BRANCH, 'develop-') }}
        run: |
          pushd nuxeo-elements
          for d in core ui dataviz testing-helpers; do
            pushd $d
            echo "ELEMENTS_$(echo $d | tr 'a-z-' 'A-Z_')=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
            popd
          done
          popd

      - name: Link elements to Web UI
        if: ${{ github.event_name == 'pull_request' || startsWith(env.REFERENCE_BRANCH, 'develop-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          # One invocation: the root preinstall hook runs npm ci in three subpackages, so
          # installing the tarballs one at a time repeats that work four times over.
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" \
            nuxeo-elements/core/${ELEMENTS_CORE} \
            nuxeo-elements/ui/${ELEMENTS_UI} \
            nuxeo-elements/dataviz/${ELEMENTS_DATAVIZ} \
            nuxeo-elements/testing-helpers/${ELEMENTS_TESTING_HELPERS}

      - name: Web UI build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
        run: mvn -B -ntp install

      - name: A11y checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
        run: mvn -B -ntp -f plugin/a11y install