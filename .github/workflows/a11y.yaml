name: A11y

on:
  pull_request:
    branches:
      - maintenance-3.0.x
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: maintenance-3.0.x
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
      PACKAGES_AUTH_USER:
        description: 'PACKAGES_AUTH_USER'
        required: true
      PACKAGES_AUTH_TOKEN:
        description: 'PACKAGES_AUTH_TOKEN'
        required: true

env:
  REFERENCE_BRANCH: maintenance-3.0.x
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'maintenance-3.0.x' }}

jobs:
  a11y:
    runs-on: [self-hosted, master]
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ env.BRANCH_NAME }}

      - run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - uses: actions/setup-node@v3
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          node-version: 18
          scope: '@nuxeo'

      # - name: Install Web UI
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      #   run: |
      #     npm install
      #     pushd packages/nuxeo-web-ui-ftest
      #     npm install
      #     popd
      #     pushd packages/nuxeo-designer-catalog
      #     npm install
      #     popd

      - uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 'Update settings.xml with server configuration'
        run: |
          echo '<settings>
              <servers>
                <server>
                  <id>maven-internal</id>
                  <username>${{ secrets.PACKAGES_AUTH_USER }}</username>
                  <password>${{ secrets.PACKAGES_AUTH_TOKEN }}</password>
                </server>
              </servers>
              </settings>' > ~/.m2/settings.xml

      - name: latest UI Elements version
        run: |
          # Get latest UI Elements pattern
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          case $BRANCH_NAME in
            maintenance-3.0.x)
              VERSION_PATTERN="v3\.0\.[0-9]+-rc\.[0-9]+$"
              ;;
            maintenance-3.1.x)
              VERSION_PATTERN="v3\.1\.[0-9]+-rc\.[0-9]+$"
              ;;
            lts-2025)
              VERSION_PATTERN="v2025\.1\.[0-9]+-rc\.[0-9]+$"
              ;;
            *)
              echo "Unknown branch pattern: $BRANCH_NAME"
              exit 1
              ;;
          esac
          
          # Get latest matching tag
          ELEMENTS_VERSION=$(curl -s https://api.github.com/repos/nuxeo/nuxeo-elements/tags | \
            jq -r '.[].name' | \
            grep -E "$VERSION_PATTERN" | \
            sort -V | \
            tail -n1 | \
            sed 's/^v//')
          
          echo "Latest nuxeo-elements version for $BRANCH_NAME: $ELEMENTS_VERSION"

      - name: Web UI build
        run: mvn -B -ntp install

      - name: A11y checks
        run: mvn -B -ntp -f plugin/a11y install
