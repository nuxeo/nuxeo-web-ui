name: A11y

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - lts-2025

  pull_request_target:
    branches:
      - maintenance-3.1.x
      - lts-2025

  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      REPOSITORY_MANAGER_USERNAME:
        required: true
      REPOSITORY_MANAGER_PASSWORD:
        required: true

permissions:
  contents: read

env:
  # Branch we are testing (head)
  BRANCH_NAME: ${{ github.head_ref || github.event.pull_request.head.ref || inputs.branch }}
  # Branch we are targeting (base)
  REFERENCE_BRANCH: ${{ github.base_ref || github.event.pull_request.base.ref || inputs.branch }}

  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/

jobs:
  a11y:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')

    runs-on: ubuntu-latest

    steps:
      - name: Debug
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Base branch: ${{ env.REFERENCE_BRANCH }}"
          echo "Head branch: ${{ env.BRANCH_NAME }}"

      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - uses: actions/setup-node@v6
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          node-version: 22
          scope: '@nuxeo'

      - name: Resolve Java version
        run: |
          if [[ "${REFERENCE_BRANCH}" == lts-* ]]; then
            echo "JAVA_VERSION=21" >> $GITHUB_ENV
          else
            echo "JAVA_VERSION=17" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm cache clean --force
          npm install
          pushd packages/nuxeo-web-ui-ftest
          npm install
          popd
          pushd packages/nuxeo-designer-catalog
          npm install
          popd

      - name: Update settings.xml with server configuration
        run: |
          echo '<settings>
            <servers>
              <server>
                <id>maven-internal</id>
                <username>${{ secrets.REPOSITORY_MANAGER_USERNAME }}</username>
                <password>${{ secrets.REPOSITORY_MANAGER_PASSWORD }}</password>
              </server>
            </servers>
          </settings>' > ~/.m2/settings.xml

      - name: Web UI build
        run: mvn -B -ntp install

      - name: A11y checks
        run: mvn -B -ntp -f plugin/a11y install