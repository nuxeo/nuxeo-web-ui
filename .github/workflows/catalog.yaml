# This workflow generates a new version of the catalog used by Nuxeo Studio Designer.
name: Designer Catalog Generator

on:
  workflow_dispatch:
    inputs:
      webui_ref:
        description: 'Web UI branch or tag (e.g. maintenance-3.1.x or v3.1.5)'
        default: 'maintenance-3.1.x'
        required: true
      target_platform:
        description: 'The Nuxeo server target platform to build the catalog for.'
        default: '2023.0'
        required: true
      debug_only:
        description: 'Run catalog generation without publishing or generating PRs'
        type: boolean
        default: false
        required: false
      classifier:
        description: 'Optional catalog classifier'
        default: ''
        required: false

  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

env:
  ARTIFACT_ID: view-designer-catalog
  GROUP_ID: org.nuxeo.web.ui.studio

jobs:
  catalog:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'v3.1.')
    steps:
      - uses: actions/checkout@v6

      - run: git config --global user.name "nuxeo-webui-jx-bot" && git config --global user.email "webui@hyland.com"

      - uses: actions/setup-node@v6
        with:
          node-version: 14

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@v0.9.0
        with:
          java-version: '17'

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Normalize execution context
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "DEBUG_ONLY=false" >> $GITHUB_ENV
            echo "WEBUI_REF=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "TARGET_PLATFORM=2023.0" >> $GITHUB_ENV
          else
            echo "DEBUG_ONLY=${{ github.event.inputs.debug_only }}" >> $GITHUB_ENV
            echo "WEBUI_REF=${{ github.event.inputs.webui_ref }}" >> $GITHUB_ENV
            echo "TARGET_PLATFORM=${{ github.event.inputs.target_platform }}" >> $GITHUB_ENV
          fi

          echo "CLASSIFIER=${{ github.event.inputs.classifier }}" >> $GITHUB_ENV

      - name: Debug catalog context
        run: |
          echo "==== CATALOG DEBUG ===="
          echo "Debug only:  $DEBUG_ONLY"
          echo "WebUI ref:   $WEBUI_REF"
          echo "Platform:    $TARGET_PLATFORM"
          echo "Classifier:  $CLASSIFIER"
          echo "======================="

      - name: Install dependencies
        working-directory: packages/nuxeo-designer-catalog
        run: |
          npm install
          npm install -g gulp

      - name: Generate catalog
        working-directory: packages/nuxeo-designer-catalog
        run: |
          gulp catalog --tp "$TARGET_PLATFORM" --webui-branch "$WEBUI_REF"
          gulp hints --tp "$TARGET_PLATFORM"

      - name: Bundle catalog
        run: |
          WEBUI_POM="packages/nuxeo-designer-catalog/data/applications/nuxeo/$TARGET_PLATFORM/nuxeo-web-ui/pom.xml"
          echo "Reading version from $WEBUI_POM"
          CATALOG_VERSION=$(xmllint \
            --xpath "//*[local-name()='project']/*[local-name()='version']/text()" \
            "$WEBUI_POM")${{ github.event.inputs.classifier }}
          echo "CATALOG_VERSION=$CATALOG_VERSION" >> $GITHUB_ENV
          pushd packages/nuxeo-designer-catalog/data/applications/nuxeo/${{ env.TARGET_PLATFORM }}
            CATALOG_NAME=$ARTIFACT_ID-$CATALOG_VERSION.zip
            echo "CATALOG_NAME=$CATALOG_NAME" >> $GITHUB_ENV
            zip -q -r "$CATALOG_NAME" nuxeo-web-ui data hints catalog.json
          popd

      - name: Archive catalog
        uses: actions/upload-artifact@v6
        with:
          name: catalog
          path: packages/nuxeo-designer-catalog/data/applications/nuxeo/${{ env.TARGET_PLATFORM }}/${{ env.CATALOG_NAME }}

      - name: Upload catalog
        if: env.DEBUG_ONLY != 'true'
        working-directory: packages/nuxeo-designer-catalog
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
        run: |
          if [[ $CATALOG_VERSION == *-SNAPSHOT ]]; then
            MVN_REPO_ID=maven-public-snapshots
            MVN_REPO_URL=https://packages.nuxeo.com/repository/maven-public-snapshots/
          else
            MVN_REPO_ID=maven-public-releases
            MVN_REPO_URL=https://packages.nuxeo.com/repository/maven-public-releases/
          fi

          pushd data/applications/nuxeo/$TARGET_PLATFORM
          mvn deploy:deploy-file \
            -Dfile="$CATALOG_NAME" \
            -DgroupId="$GROUP_ID" \
            -DartifactId="$ARTIFACT_ID" \
            -Dversion="$CATALOG_VERSION" \
            -Dpackaging=zip \
            -DrepositoryId="$MVN_REPO_ID" \
            -Durl="$MVN_REPO_URL"
          popd

      - name: Checkout NOS repository
        if: env.DEBUG_ONLY != 'true'
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nos
          token: ${{ secrets.WEBUI_JX_BOT_GITHUB_ACTIONS_TOKEN }}
          path: nos

      - name: Create pull request in NOS
        if: env.DEBUG_ONLY != 'true'
        working-directory: nos
        env:
          GH_TOKEN: ${{ secrets.WEBUI_JX_BOT_GITHUB_ACTIONS_TOKEN }}
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
          NOS_TEAM_PASSWORD: ${{ secrets.WEBUI_JX_BOT_GITHUB_ACTIONS_TOKEN }}
        run: |
          BRANCH=designer-catalog-update-$CATALOG_VERSION
          git fetch origin
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch exists. Checking out and pulling..."
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
          else
            echo "Branch does not exist. Creating new branch from master..."
            git checkout master
            git pull origin master
            git checkout -b "$BRANCH"
          fi

          mvn versions:set-property -Dproperty=view.designer.catalog.2023.0 -DnewVersion="$CATALOG_VERSION"
          git add .
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Designer catalog to $CATALOG_VERSION"
            git push origin "$BRANCH"
          fi
         
          gh pr create --base master --fill || echo "PR already exists"
