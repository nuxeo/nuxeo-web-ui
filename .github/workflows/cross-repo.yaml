# This workflow is not intended to be triggered manually from the Web UI repository,
# but to be called from the Elements repository cross repo check instead.
name: Cross repo check

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The name of the branch to build.'
        required: true
      sauce_labs:
        description: 'Run unit tests on Sauce Labs?'
        default: false
        type: boolean
        required: false
      skip_ftests:
        description: 'Skip functional tests?'
        type: boolean
        required: false
      skip_a11y:
        description: 'Skip accessibility tests?'
        type: boolean
        required: false
      skip_unit_tests:
        description: 'Skip unit tests?'
        type: boolean
        required: false
      generate_metrics:
        description: 'Generate metrics report?'
        type: boolean
        required: false
      run_all:
        description: 'Skip fail fast premise?'
        type: boolean
        required: false
      bail:
        description: 'Number of failed features to stop test runner (0 means not applicable).'
        default: 0
        required: false
      caller_id:
        description: 'run identifier'
        type: string
        required: false

# Cancel a superseded in-flight run for the same source branch when a newer commit is dispatched, so
# rapid pushes don't stack multiple ~1h ftest runs (previously done by manually cancelling old runs).
# Keyed by BOTH the target base branch (github.ref_name, e.g. lts-2025 vs maintenance-3.1.x — the bare
# name, without the refs/heads/ prefix) and the dispatching source branch, so parallel runs for
# different bases never cancel each other even when they share the same branch_name.
concurrency:
  group: cross-repo-${{ github.ref_name }}-${{ github.event.inputs.branch_name }}
  cancel-in-progress: true

env:
  # The base branch this run targets. The Elements cross-repo check dispatches this workflow
  # against that ref, so github.ref_name is it — as the concurrency comment above also relies on.
  # Was hardcoded to this line's release branch. Elements dispatches each line's own copy,
  # so that matched until now; a develop-20XX run would have been sent to released code.
  REFERENCE_BRANCH: ${{ github.ref_name }}
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/

jobs:
  id:
    name: Remote Caller ID ${{ github.event.inputs.caller_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - env:
          CALLER_ID: ${{ github.event.inputs.caller_id }}
        run: echo "run identifier $CALLER_ID"

  build:
    name: Build
    needs: id
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - name: Build parameters
        env:
          BUILD_PARAMS: ${{ toJSON(github.event.inputs) }}
        run: echo "$BUILD_PARAMS"

      - uses: actions/setup-node@v6
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          always-auth: true
          scope: '@nuxeo'
          node-version: 22

      # get-branch returns default-branch without checking that it exists, so the fallback has
      # to name a branch both repositories actually have. A dispatch from any other ref would
      # otherwise resolve to something that is not there and fail at checkout.
      - name: Resolve the line to pair on
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            lts-2025 | lts-20[0-9][0-9] | develop-20[0-9][0-9]) ;;
            *) REF_NAME=lts-2025 ;;
          esac
          echo "REFERENCE_BRANCH=$REF_NAME" >> "$GITHUB_ENV"

      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and a git ref may legally contain $( ) or
      # backticks. Queried as a full ref so a partial name cannot match by tail.
      - name: Determine nuxeo-web-ui branch to use
        id: pick_nuxeo_web_ui_branch
        env:
          CANDIDATE: ${{ github.event.inputs.branch_name }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          # branch_name names the Elements branch being tested, so a Web UI branch of the same
          # name is a coincidence - except for sync/<release>-to-<dev>, which both repositories
          # generate from the same template. Matching on that would compare the Elements work
          # against Web UI's release snapshot instead of the development line.
          case "$CANDIDATE" in sync/*) CANDIDATE="" ;; esac
          if [ -n "$CANDIDATE" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-web-ui "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
            BRANCH="$CANDIDATE"
          fi
          echo "Using nuxeo/nuxeo-web-ui branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and a git ref may legally contain $( ) or
      # backticks. Queried as a full ref so a partial name cannot match by tail.
      - name: Determine nuxeo-elements branch to use
        id: pick_nuxeo_elements_branch
        env:
          CANDIDATE: ${{ github.event.inputs.branch_name }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          if [ -n "$CANDIDATE" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-elements "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
            BRANCH="$CANDIDATE"
          fi
          echo "Using nuxeo/nuxeo-elements branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout nuxeo-web-ui repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-web-ui
          ref: ${{ steps.pick_nuxeo_web_ui_branch.outputs.branch }}

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@314c39e8c2e913db2dc63a31670612ccb2b6e569 # v0.10.4
        with:
          java-version: '21'

      - name: Install Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm ci --ignore-scripts
          pushd packages/nuxeo-web-ui-ftest
          npm ci --ignore-scripts
          popd
          pushd plugin/a11y
          npm ci --ignore-scripts
          popd
          pushd packages/nuxeo-designer-catalog
          npm ci --ignore-scripts
          popd

      - name: Lint Web UI
        run: npm run lint

      - name: Checkout the nuxeo-elements repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Pack Elements modules
        run: |
          pushd nuxeo-elements
          pushd core
          echo "ELEMENTS_CORE=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
          popd

          pushd ui
          echo "ELEMENTS_UI=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
          popd

          pushd dataviz
          echo "ELEMENTS_DATAVIZ=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
          popd

          pushd testing-helpers
          echo "ELEMENTS_HELPERS=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
          popd
          popd

      - name: Link elements to Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/core/${ELEMENTS_CORE}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/ui/${ELEMENTS_UI}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/dataviz/${ELEMENTS_DATAVIZ}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/testing-helpers/${ELEMENTS_HELPERS}

      - name: Web UI Unit tests
        if: ${{ github.event.inputs.skip_unit_tests == 'false' && github.event.inputs.sauce_labs == 'false' }}
        run: npm run test

      - name: Web UI Unit tests (Sauce Labs)
        if: ${{ github.event.inputs.skip_unit_tests == 'false' && github.event.inputs.sauce_labs == 'true' }}
        env:
          SAUCE_USERNAME: nuxeo-web-ui
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: npm run test

      - name: Nuxeo package build and Ftests
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
          RUN_ALL: ${{ github.event.inputs.run_all }}
          BAIL: ${{ github.event.inputs.bail }}
          SKIP_FTESTS: ${{ github.event.inputs.skip_ftests }}
          GENERATE_METRICS: ${{ github.event.inputs.generate_metrics }}
        run: |
          profiles=()
          if [ "$SKIP_FTESTS" = "false" ]
          then
            profiles+=('ftest')
          fi
          if [ "$GENERATE_METRICS" = "true" ]
          then
            profiles+=('metrics')
          fi
          active_profiles=""
          if [ ${#profiles[@]} -gt 0 ]
          then
            active_profiles="-P$(printf -v active_profiles '%s,' "${profiles[@]}" && echo "${active_profiles%,}")"
          fi
          mvn install -ntp $active_profiles -DskipInstall

      - name: A11y checks
        if: ${{ github.event.inputs.skip_a11y == 'false' }}
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
        run: mvn -B -nsu -f plugin/a11y -ntp install

      - name: Archive cucumber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: ftest/target/cucumber-reports/

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ftest/target/screenshots/

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            **/log/*.log
            **/nxserver/config/distribution.properties

      - name: Archive packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            plugin/web-ui/marketplace/target/nuxeo-web-ui-marketplace-*.zip
            plugin/itests/marketplace/target/nuxeo-web-ui-marketplace-itests-*.zip