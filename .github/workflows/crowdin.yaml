# Workflow that syncronizes translations from Crowdin
name: Crowdin Sync

on:
  # Make workflow reusable, to be called by the scheduled crowdin workflow in the default branch
  workflow_call:

  # Sync when a commit is done on lts-2025
  push:
    branches: ["lts-2025"]
    paths:
      - 'i18n/messages.json'

  # Manually trigger the workflow
  workflow_dispatch:
  
jobs:
  crowdin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: lts-2025

      - name: Crowdin Action
        id: crowdin-sync
        uses: crowdin/github-action@v2.16.2
        with:
          # Skip the action's internal ref checkout because this workflow already checks out lts-2025 explicitly.
          skip_ref_checkout: true

          # Tokens
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # Load external configuration file (to support translation rename)
          config: crowdin-conf.yml

          # Upload sources for translation
          upload_sources: true

          # Auto-approve reference sentences we are pushing (english)
          auto_approve_imported: true

          # Name of the branch where to merge the translations
          localization_branch_name: crowdin-translations-update-lts-2025
          pull_request_base_branch_name: lts-2025
          create_pull_request: true
          pull_request_title: 'New Crowdin translations by GitHub Action (lts-2025)'
          pull_request_body: 'New Crowdin pull request with translations lts 2025'

          # The commit message
          commit_message: 'Automatic update of translations from Crowdin'

          # Automatically download all the new translations
          download_translations: true

          # User properties
          github_user_name: nuxeo-webui-jx-bot
          github_user_email: webui@hyland.com

        env:
          GITHUB_TOKEN: ${{ secrets.WEBUI_JX_BOT_GITHUB_ACTIONS_TOKEN }}