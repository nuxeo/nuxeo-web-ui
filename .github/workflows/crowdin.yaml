# Workflow that syncronizes translations from Crowdin
name: Crowdin Sync

on:
  # Check for updates every day
  schedule:
    - cron: '0 0 * * *'

  # Sync when a commit is done on maintenance-3.1.x
  push:
    branches: ["maintenance-3.1.x"]
    paths:
      - 'i18n/messages.json'

  # Manually trigger the workflow
  workflow_dispatch:
  
jobs:
  # in uses, cannot use environment variable for {owner}/{repo} nor matrix strategy variable for {ref}
  # thus hardcoding them
  call-workflow-in-lts-2025:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: nuxeo/nuxeo-web-ui/.github/workflows/crowdin.yaml@lts-2025
    secrets: inherit
    needs: crowdin

    crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: maintenance-3.1.x

      # Add GitHub debug logging
      - name: Enable debug logging
        run: |
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
          echo "ACTIONS_RUNNER_DEBUG=true" >> $GITHUB_ENV
          echo "CROWDIN_DEBUG=true" >> $GITHUB_ENV
          echo "NODE_DEBUG=crowdin,request" >> $GITHUB_ENV

      - name: Crowdin Action (with debug)
        id: crowdin-sync
        uses: crowdin/github-action@1.5.2
        with:
          skip_ref_checkout: true

          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

          config: crowdin-conf.yml
          upload_sources: true
          auto_approve_imported: true

          localization_branch_name: crowdin-translations-update-lts-2023
          pull_request_base_branch_name: maintenance-3.1.x
          create_pull_request: true
          pull_request_title: 'New Crowdin translations by GitHub Action (lts-2023)'
          pull_request_body: |
            Automated Crowdin sync triggered by GitHub Actions.

            Debug Info:
            - GitHub Run ID: ${{ github.run_id }}
            - Workflow Actor: ${{ github.actor }}
            - Event: ${{ github.event_name }}
            - Ref: ${{ github.ref }}

          commit_message: 'Automatic update of translations from Crowdin lts 2023'
          download_translations: true
          verbose: true

          github_user_name: nuxeo-webui-jx-bot
          github_user_email: webui@hyland.com

        env:
          GITHUB_TOKEN: ${{ secrets.WEBUI_JX_BOT_GITHUB_ACTIONS_TOKEN }}

      # Add post-step logging 
      - name: Log Crowdin PR outputs
        if: always()
        run: |
          echo "Crowdin Action Outputs:"
          echo "  PR URL: ${{ steps.crowdin-sync.outputs.pull_request_url }}"
          echo "  Commit SHA: ${{ steps.crowdin-sync.outputs.commit_sha }}"
          echo "  Branch: crowdin-translations-update-lts-2023"
