name: Dependabot CVE Triage

on:
  schedule:
    # Monday 07:30 UTC = Monday 13:00 Asia/Kolkata. GitHub schedules can be delayed.
    - cron: '30 7 * * 1'
    # Optional one-time date; job is skipped unless TRIAGE_ONE_TIME_AT is configured.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview reads sources only; automatic creates/updates Jira and posts to the dedicated Teams webhook'
        type: choice
        options: [preview, automatic]
        default: preview
      delivery_resolution:
        description: 'Only after manually checking a prior uncertain Teams delivery'
        type: choice
        options: [none, delivered, not-delivered]
        default: none
      delivery_message_url:
        description: 'Existing Teams message link required when confirming prior delivery'
        type: string
        required: false

concurrency:
  group: dependabot-cve-triage
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1' || vars.TRIAGE_ONE_TIME_AT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRIAGE_RUN_NUMBER: ${{ github.run_number }}
      TRIAGE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.DEPENDABOT_TRIAGE_MODE || 'preview' }}
      ALLOW_AUTOMATIC: ${{ vars.DEPENDABOT_TRIAGE_ALLOW_AUTOMATIC || 'false' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APPROVED_PREMERGE_SHA: ${{ vars.DEPENDABOT_TRIAGE_PREMERGE_SHA }}
      SECURITY_EPIC: ${{ vars.SECURITY_EPIC || 'NXENG-987' }}
      SECURITY_EPIC_QUARTER: ${{ vars.SECURITY_EPIC_QUARTER || '2026-Q4' }}
      TRIAGE_ONE_TIME_AT: ${{ vars.TRIAGE_ONE_TIME_AT }}
      SCHEDULE_TRIGGER: ${{ github.event.schedule }}
      DELIVERY_RESOLUTION: ${{ inputs.delivery_resolution || 'none' }}
      DELIVERY_MESSAGE_URL: ${{ inputs.delivery_message_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set runner-local state directory
        run: echo "TRIAGE_STATE_DIR=$RUNNER_TEMP/dependabot-triage" >> "$GITHUB_ENV"
      - name: Install isolated triage dependencies
        run: npm ci --ignore-scripts --prefix .github/scripts/dependabot-triage
      - name: Test triage invariants
        run: npm test --prefix .github/scripts/dependabot-triage
      - name: Restore last durable checkpoint and write journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-triage/run.mjs restore
      - name: Check weekly or optional one-time schedule
        id: due
        run: node .github/scripts/dependabot-triage/run.mjs gate
      - name: Reconcile all open alerts and Jira coverage
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_ADMIN_TOKEN }}
          JIRA_EMAIL: ${{ secrets.DEPENDABOT_TRIAGE_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_TOKEN }}
        run: node .github/scripts/dependabot-triage/run.mjs scan
      # Persist intent BEFORE writes. Even a killed runner leaves enough information
      # to re-query Jira and resolve uncertain delivery without blind retries.
      - name: Save pre-write journal
        if: steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-triage-state-${{ github.run_id }}-${{ github.run_attempt }}-intent
          path: ${{ env.TRIAGE_STATE_DIR }}/state.json
          retention-days: 90
          if-no-files-found: error
      - name: Apply approved Jira actions
        uses: actions/github-script@v8
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_ADMIN_TOKEN }}
          JIRA_EMAIL: ${{ secrets.DEPENDABOT_TRIAGE_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_TOKEN }}
        with:
          script: |
            process.argv[2] = 'apply';
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/dependabot-triage/run.mjs')).href);
      - name: Prepare notification intent
        if: steps.due.outputs.run == 'true'
        run: node .github/scripts/dependabot-triage/run.mjs prepare-notification
      - name: Save notification intent
        if: steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-triage-state-${{ github.run_id }}-${{ github.run_attempt }}-notification
          path: ${{ env.TRIAGE_STATE_DIR }}/state.json
          retention-days: 90
          if-no-files-found: error
      - name: Post dedicated Teams summary (automatic mode only)
        if: steps.due.outputs.run == 'true'
        env:
          DEPENDABOT_TEAMS_WEBHOOK_URL: ${{ secrets.DEPENDABOT_TEAMS_WEBHOOK_URL }}
        run: node .github/scripts/dependabot-triage/run.mjs notify
      - name: Commit successful processing checkpoint
        if: steps.due.outputs.run == 'true'
        run: node .github/scripts/dependabot-triage/run.mjs finish
      - name: Save final durable state
        if: always() && (steps.due.outputs.run == 'true' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-triage-state-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: ${{ env.TRIAGE_STATE_DIR }}/state.json
          retention-days: 90
          if-no-files-found: warn
      - name: Publish report and preview payload
        if: always() && (steps.due.outputs.run == 'true' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-triage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRIAGE_STATE_DIR }}/report.md
            ${{ env.TRIAGE_STATE_DIR }}/report.json
            ${{ env.TRIAGE_STATE_DIR }}/teams-payload.json
          retention-days: 30
          if-no-files-found: warn
      - name: Add report to run summary
        if: always() && (steps.due.outputs.run == 'true' || failure())
        run: |
          if [ -f "$TRIAGE_STATE_DIR/report.md" ]; then
            cat "$TRIAGE_STATE_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scan incomplete: setup or state restoration failed before a report could be generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
