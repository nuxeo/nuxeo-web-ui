name: Functional tests

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'

  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        required: false
        default: ''
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      REPOSITORY_MANAGER_USERNAME:
        required: true
      REPOSITORY_MANAGER_PASSWORD:
        required: true

env:
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/
  NODE_OPTIONS: "--max-old-space-size=2048"
  REFERENCE_BRANCH: ${{ github.base_ref || inputs.branch || github.ref_name }}

jobs:
  # The 46 feature files are split across four runners, each with its own Nuxeo server, because
  # WebdriverIO itself has to stay serial (maxInstances: 1): every in-process worker would share
  # the one server this job starts, while search.feature asserts repo-wide absolute result counts
  # and the fixture `After` hooks delete users and groups globally. Sharding at job level makes
  # those collisions impossible by construction and needs no changes to the tests.
  #
  # scripts/test/ftest/shards.js owns the shard -> feature mapping and, via `npm run lint`, fails
  # CI when a feature file is assigned to no shard or to more than one.
  ftests-shard:
    name: ftests (shard ${{ matrix.shard }})
    runs-on:
      group: medium-4cpu-runners
    permissions:
      contents: read
    strategy:
      # One shard failing must not cancel the rest: the remaining shards cover three quarters of
      # the suite, and losing their results turns one known failure into an unknown amount of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Debug
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Ref: ${{ github.ref }}"
          echo "Shard: ${{ matrix.shard }}"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Honour an explicit workflow_call branch. Empty on pull_request, which leaves
          # checkout on the PR merge commit instead of the head branch.
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          registry-url: ${{ env.NPM_REPOSITORY }}
          always-auth: true
          scope: '@nuxeo'
          node-version: 24

      - name: Resolve JDK version
        id: jdk
        run: |
          # Derived from the version being built, not the branch name, so it stays correct on
          # dev branches. LTS 2023 (3.1.x) builds on Java 17; 2025 and later on Java 21.
          PACKAGE_VERSION=$(jq -r .version package.json)
          case "$PACKAGE_VERSION" in
            3.1.*)    echo "version=17" >> "$GITHUB_OUTPUT" ;;
            20[0-9][0-9].*) echo "version=21" >> "$GITHUB_OUTPUT" ;;
            *)
              # Explicit rather than defaulting: an unreadable package.json or a version shape
              # nobody has taught this about should stop the build, not silently pick a JDK.
              echo "::error::Cannot derive a JDK version from package.json version '$PACKAGE_VERSION'."
              exit 1
              ;;
          esac

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@314c39e8c2e913db2dc63a31670612ccb2b6e569 # v0.10.4
        with:
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Purge cached Nuxeo artifacts
        run: rm -rf ~/.m2/repository/org/nuxeo

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick poppler-utils libreoffice ffmpeg libwpd-tools ghostscript exiftool
          # ImageMagick 6 (Ubuntu 24.04) ships a policy that disables the Ghostscript formats
          # (PS, EPS, PDF, XPS) the PDF/picture conversions need, so that block is removed.
          # ImageMagick 7 (Ubuntu 26.04, installed since the runner image moved on 2026-10-19)
          # keeps its policy in /etc/ImageMagick-7 and does not restrict those formats at all,
          # so there is nothing to remove there.
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            sudo sed -i '/disable ghostscript format types/,+6d' /etc/ImageMagick-6/policy.xml
          fi
          npm install -g --ignore-scripts bower@1.8.14 gulp-cli@3.1.0

      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and github.head_ref is controlled by whoever
      # opens the pull request - a git ref may legally contain $( ) or backticks.
      - name: Determine nuxeo-elements branch to link
        id: pick_nuxeo_elements_branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          # Both repositories generate sync/<release>-to-<dev> from the same template, so a match
          # on that name means "a workflow made one here too", not "the paired work lives here".
          # Pairing on it would test the merged dev work against the other repo's release snapshot.
          # The `*)` branch is a deliberate no-op — any other ref is paired on as-is — and is
          # spelled out because a `case` with no default trips Sonar's githubactions:S131.
          case "$HEAD_REF" in
            sync/*) HEAD_REF="" ;;
            *) ;;
          esac
          # Queried as a full ref: ls-remote matches patterns against the tail of a ref name,
          # so a bare "fix/foo" would also match a branch called "feature/fix/foo" and we would
          # then try to check out a branch that does not exist.
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-elements "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            BRANCH="$HEAD_REF"
          fi
          echo "Pairing with nuxeo-elements branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm ci --ignore-scripts
          pushd packages/nuxeo-web-ui-ftest
          npm ci --ignore-scripts
          popd
          pushd packages/nuxeo-designer-catalog
          npm ci --ignore-scripts
          popd

      - name: Checkout the nuxeo-elements repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Pack Elements modules
        run: |
          pushd nuxeo-elements
          for d in core ui dataviz testing-helpers; do
            pushd $d
            echo "ELEMENTS_$(echo $d | tr 'a-z-' 'A-Z_')=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
            popd
          done
          popd

      - name: Link elements to Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/core/${ELEMENTS_CORE}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/ui/${ELEMENTS_UI}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/dataviz/${ELEMENTS_DATAVIZ}
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" nuxeo-elements/testing-helpers/${ELEMENTS_TESTING_HELPERS}

      # Resolved in its own step rather than inline below so that the shard -> feature mapping has
      # exactly one home, which the same script can then guard against drift.
      - name: Resolve this shard's feature files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          SPECS=$(node scripts/test/ftest/shards.js --specs "$SHARD")
          echo "Shard $SHARD runs: $SPECS"
          echo "FTEST_SPECS=$SPECS" >> "$GITHUB_ENV"

      # FTEST_SPECS reaches WebdriverIO through $GITHUB_ENV rather than this step's env block:
      # mvn -Pftest binds ftest/itests.xml, whose `run-tests` target shells out to `npm run ftest`
      # via Ant <exec>. Neither <exec> sets newenvironment, so both inherit the step environment,
      # and scripts/test/ftest/runner.js spawns the runner without an explicit env either.
      - name: Functional tests
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
          RUN_ALL: false
          BAIL: 0
          HEADLESS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'video') && 'false' || 'true' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/xvfb-record@157729461e042ea6cdcca867bed794bded85b303 # v17.6.2
        with:
          test_command: mvn -ntp install -Pftest -DskipInstall
          timeout_minutes: 120
          # Shard-suffixed for the same reason as the artifacts below: xvfb-record archives the
          # recording itself, as `xvfbrecording-<video_name>`, so a name shared across the four
          # shards would collide and fail them. An empty value still disables recording entirely.
          video_name: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'video') && format('ftest-video-shard-{0}', matrix.shard) || '' }}
          max_attempts: 3

      # Every artifact name carries the shard: upload-artifact@v7 fails on a name another job in
      # the same run already used, so the four shards would otherwise collide on all of these.
      - name: Archive cucumber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports-shard-${{ matrix.shard }}
          path: ftest/target/cucumber-reports/

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: ftest/target/screenshots/

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-shard-${{ matrix.shard }}
          path: |
            **/log/*.log
            **/nxserver/config/distribution.properties

      - name: Archive packages-ftest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages-ftest-shard-${{ matrix.shard }}
          path: |
            plugin/web-ui/marketplace/target/nuxeo-web-ui-marketplace-*.zip
            plugin/itests/marketplace/target/nuxeo-web-ui-marketplace-itests-*.zip

  # Branch protection on maintenance-3.1.x, lts-2025, develop-2023 and develop-2025 requires a
  # status check named exactly `ftests`. A matrix job reports `ftests (shard 1)`, `ftests (shard 2)`
  # and so on but never a bare `ftests`, so moving the matrix onto a job of that name would leave
  # the required check pending forever and block every pull request. Keeping the shards under their
  # own job id and gating on them here means `ftests` is still reported, passing only when all four
  # shards passed, and no branch protection setting has to change.
  ftests:
    needs: ftests-shard
    # always(), not success(): a skipped required check counts as satisfied for branch protection,
    # so this job has to run and fail explicitly on a shard that failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check shard results
        env:
          # The aggregate over the whole matrix - success only when every shard succeeded.
          RESULT: ${{ needs.ftests-shard.result }}
        run: |
          echo "Functional test shards: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::At least one functional test shard did not pass (result: $RESULT)."
            exit 1
          fi
