name: Lint

on:
  pull_request:
    branches:
      - lts-2025

  workflow_call:
    inputs:
      branch:
        description: 'Branch to lint'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'lts-2025' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # The eslint stack is what sets engines.node, so the floor has to be
      # linted, not just tested. 22.13.0 is pinned exactly: `22` would resolve
      # to the newest 22.x and never exercise the version we actually promise.
      fail-fast: false
      matrix:
        node-version: ['22.13.0', 24]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: ${{ matrix.node-version }}
          scope: '@nuxeo'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint