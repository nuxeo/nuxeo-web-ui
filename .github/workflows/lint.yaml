name: Lint

on:
  pull_request:
    branches:
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'

  workflow_call:
    inputs:
      branch:
        description: 'Branch to lint'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Honour an explicit workflow_call branch. Empty on pull_request, which leaves
          # checkout on the PR merge commit instead of the head branch.
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint