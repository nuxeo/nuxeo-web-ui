name: Main

on:
  push:
    branches:
      - maintenance-3.1.x
      - lts-2025
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH_NAME: ${{ github.ref_name }}
  JAVA_VERSION: ${{ github.ref_name == 'lts-2025' && '21' || '17' }}
  ELEMENTS_PATTERN: ${{ github.ref_name == 'lts-2025' && '2025\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$' || '3\\.1\\.[0-9]+-rc\\.[0-9]+$' }}

jobs:
  lint:
    uses: nuxeo/nuxeo-web-ui/.github/workflows/lint.yaml@${{ github.ref_name }}
    secrets:
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

  test:
    uses: nuxeo/nuxeo-web-ui/.github/workflows/test.yaml@${{ github.ref_name }}
    secrets:
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    with:
      branch: ${{ github.ref_name }}

  a11y:
    uses: nuxeo/nuxeo-web-ui/.github/workflows/a11y.yaml@${{ github.ref_name }}
    secrets:
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      REPOSITORY_MANAGER_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
      REPOSITORY_MANAGER_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
    with:
      branch: ${{ github.ref_name }}

  ftest:
    uses: nuxeo/nuxeo-web-ui/.github/workflows/ftest.yaml@${{ github.ref_name }}
    secrets:
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      REPOSITORY_MANAGER_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
      REPOSITORY_MANAGER_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
    with:
      branch: ${{ github.ref_name }}

  build:
    needs: [lint, test, a11y, ftest]
    runs-on:
      group: medium-4cpu-runners

    steps:
      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4

      - run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - uses: actions/setup-node@v3
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare environment
        run: |
          echo "PACKAGE_VERSION=$(npx -c 'echo "$npm_package_version"')" >> $GITHUB_ENV

      - name: Get prerelease version
        run: |
          git fetch origin --tags
          RC_VERSION=$(git tag --sort=taggerdate --list "v${PACKAGE_VERSION/-SNAPSHOT}*" | tail -1 | tr -d '\n')
          echo "VERSION=$(npx semver -i prerelease --preid rc ${RC_VERSION:-$PACKAGE_VERSION})" >> $GITHUB_ENV

      - name: Update versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          find . -type f -not -path "./node_modules/*" -regex ".*\.\(yaml\|sample\|xml\)" -exec sed -i 's/'"$PACKAGE_VERSION"'/'"$VERSION"'/g' {} \;

          PADDED=$(printf '%03d' $(echo $VERSION | sed -r s/[0-9]+\.[0-9]+\.[0-9]+-rc\.\([0-9]+\)/\\1/g))
          PADDED_VERSION=$(echo $VERSION | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+-rc\.)[0-9]+/\\1$PADDED/g")
          echo "PADDED_VERSION=$PADDED_VERSION" >> $GITHUB_ENV
          sed -i -e 's/\${project.version}/'"$PADDED_VERSION"'/g' plugin/web-ui/marketplace/pom.xml

          npm version ${VERSION} --no-git-tag-version

          ELEMENTS_VERSION=$(npm view @nuxeo/nuxeo-ui-elements versions --json \
            | jq -r '.[]' \
            | grep -E "${{ env.ELEMENTS_PATTERN }}" \
            | sort -V | tail -n1)

          echo "Latest nuxeo-elements version: $ELEMENTS_VERSION"

          jq --arg ver "~$ELEMENTS_VERSION" '
            .dependencies."@nuxeo/nuxeo-dataviz-elements" = $ver |
            .dependencies."@nuxeo/nuxeo-elements" = $ver |
            .dependencies."@nuxeo/nuxeo-ui-elements" = $ver |
            .devDependencies."@nuxeo/testing-helpers" = $ver
          ' package.json > tmp.json && mv tmp.json package.json

          pushd packages/nuxeo-web-ui-ftest
          npm version ${VERSION} --no-git-tag-version
          popd

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm install
          (cd packages/nuxeo-web-ui-ftest && npm install)
          (cd packages/nuxeo-designer-catalog && npm install)

      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          echo '<settings>
            <servers>
              <server>
                <id>maven-internal</id>
                <username>${{ secrets.REPOSITORY_MANAGER_USERNAME }}</username>
                <password>${{ secrets.REPOSITORY_MANAGER_PASSWORD }}</password>
              </server>
            </servers>
          </settings>' > ~/.m2/settings.xml

      - name: Build packages
        run: |
          mvn -ntp install -DskipInstall
          mvn -B -nsu -ntp -f plugin/itests/addon install
          mvn -B -nsu -ntp -f plugin/itests/marketplace install

      - name: Archive packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            plugin/web-ui/marketplace/target/nuxeo-web-ui-marketplace-*.zip
            plugin/itests/marketplace/target/nuxeo-web-ui-marketplace-itests-*.zip

      - name: Tag
        run: |
          git add package-lock.json packages/nuxeo-web-ui-ftest/package-lock.json
          git commit -a -m "Release ${VERSION}"
          git tag -a v${VERSION} -m "Release ${VERSION}"
          git push origin v${VERSION}

      - name: Publish Nuxeo packages
        env:
          CONNECT_PREPROD_URL: https://nos-preprod-connect.nuxeocloud.com/nuxeo
        run: |
          PACKAGE="plugin/web-ui/marketplace/target/nuxeo-web-ui-marketplace-${PADDED_VERSION}.zip"
          curl -u "${{ secrets.CONNECT_PREPROD_AUTH }}" \
               -F package=@$PACKAGE \
               "$CONNECT_PREPROD_URL/site/marketplace/upload?batch=true"

      - name: Publish Web UI FTest framework
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          cd packages/nuxeo-web-ui-ftest
          npm publish --@nuxeo:registry=https://packages.nuxeo.com/repository/npm-public/ --tag SNAPSHOT