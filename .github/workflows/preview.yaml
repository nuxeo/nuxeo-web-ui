name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - maintenance-3.1.x
      - 'develop-20[0-9][0-9]'

  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The name of the branch to preview.'
        default: 'maintenance-3.1.x'
        required: true
      caller_id:
        description: 'run identifier'
        default: 'maintenance-3.1.x'
        type: string
        required: false
      nuxeo_packages:
        description: 'Space/comma-separated Web UI addons to bundle into the image (e.g. "nuxeo-drive nuxeo-csv"). Overrides the NUXEO_PACKAGES repository variable used for PR previews.'
        default: ''
        type: string
        required: false
      nuxeo_server_packages:
        description: 'Space/comma-separated Nuxeo Connect server packages to pre-install. Overrides the NUXEO_SERVER_PACKAGES repository variable (which defaults to replace-administrator-user).'
        default: ''
        type: string
        required: false

env:
  REGISTRY: docker-internal.packages.nuxeo.com
  REPOSITORY: nuxeo/nuxeo-web-ui
  # Base Nuxeo server image tag; nuxeo-docker-build pulls docker-private.packages.nuxeo.com/nuxeo/nuxeo:<tag>.
  BASE_IMAGE_TAG: '2023'

jobs:
  id:
    name: Remote Caller ID ${{ github.event.inputs.caller_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo run identifier ${{ github.event.inputs.caller_id }}

  preview:
    needs: id
    name: Setup
    outputs:
      image: ${{ steps.preview.outputs.image }}
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      contains(github.event.pull_request.labels.*.name, 'preview') ||
      github.event_name == 'workflow_dispatch'
    runs-on:
      group: medium-4cpu-runners
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Set branch name
        env:
          # Through the environment, never interpolated into the script: a git ref may legally
          # contain $( ) or backticks, and command substitution runs when the assignment is
          # evaluated - before the whitelist below gets a chance to reject it.
          INPUT_BRANCH: ${{ github.event.inputs.branch_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RAW_BRANCH="$GITHUB_HEAD_REF"
          else
            RAW_BRANCH="$INPUT_BRANCH"
          fi
          echo "BRANCH_NAME=$RAW_BRANCH" >> "$GITHUB_ENV"

          # The line to pair the two repositories on, used as the fallback for the lookups below.
          # BRANCH_NAME is a feature ref, which rarely exists in the sibling repository, so the
          # fallback is what actually gets used and it has to name a branch that is really there.
          REFERENCE_BRANCH="${BASE_REF:-$REF_NAME}"
          case "$REFERENCE_BRANCH" in
            maintenance-3.1.x | develop-20[0-9][0-9]) ;;
            *) REFERENCE_BRANCH=maintenance-3.1.x ;;
          esac
          echo "REFERENCE_BRANCH=$REFERENCE_BRANCH" >> "$GITHUB_ENV"

      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and a git ref may legally contain $( ) or
      # backticks. Queried as a full ref so a partial name cannot match by tail.
      - name: Determine nuxeo-web-ui branch to use
        id: pick_nuxeo_web_ui_branch
        env:
          CANDIDATE: ${{ env.BRANCH_NAME }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          if [ -n "$CANDIDATE" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-web-ui "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
            BRANCH="$CANDIDATE"
          fi
          echo "Using nuxeo/nuxeo-web-ui branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pick_nuxeo_web_ui_branch.outputs.branch }}

      - name: Prepare environment
        run: |
          BASE_VERSION="$(node -p 'require("./package.json").version')"
          # Image version: replace a -SNAPSHOT suffix with -preview, otherwise append -snapshot.
          if echo "$BASE_VERSION" | grep -qiE 'snapshot'; then
            IMAGE_VERSION="$(echo "$BASE_VERSION" | sed -E 's/-?snapshot/-preview/I')"
          else
            IMAGE_VERSION="${BASE_VERSION}-snapshot"
          fi
          # Uniquely identify this run by appending the workflow run id (dot-separated).
          echo "VERSION=${IMAGE_VERSION}.${{ github.run_id }}" >> "$GITHUB_ENV"

      # Inlined rather than using ui-team-gh-actions/get-branch: that action interpolates its
      # branch input straight into a shell command, and a git ref may legally contain $( ) or
      # backticks. Queried as a full ref so a partial name cannot match by tail.
      - name: Determine nuxeo-elements branch to use
        id: pick_nuxeo_elements_branch
        env:
          CANDIDATE: ${{ env.BRANCH_NAME }}
          FALLBACK: ${{ env.REFERENCE_BRANCH }}
        run: |
          BRANCH="$FALLBACK"
          # On a pull request, BRANCH_NAME is the Web UI head. An Elements branch of the same name
          # is a coincidence - except for sync/<release>-to-<dev>, which both repositories generate
          # from the same template, so matching it would pair against Elements' release snapshot.
          # A manual dispatch names its branch deliberately, so it is left alone.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            case "$CANDIDATE" in sync/*) CANDIDATE="" ;; esac
          fi
          if [ -n "$CANDIDATE" ] && git ls-remote --exit-code --heads \
               https://github.com/nuxeo/nuxeo-elements "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
            BRANCH="$CANDIDATE"
          fi
          echo "Using nuxeo/nuxeo-elements branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout the nuxeo-elements repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm ci --ignore-scripts
          # Pack each elements module and install the resulting tarball so the packages
          # land as real files under node_modules/@nuxeo/... instead of a symlink.
          # Webpack resolves symlinks to their real path, which otherwise rewrites
          # lazily-loaded resource URLs under nuxeo-elements/ui/... and breaks document
          # previews and admin layouts in the preview image (WEBUI-2222).
          for module in core ui dataviz; do
            tarball="$(cd "nuxeo-elements/${module}" && npm pack 2>&1 | tail -1)"
            npm install --no-package-lock --ignore-scripts "nuxeo-elements/${module}/${tarball}"
          done

      - name: Webpack build
        env:
          NUXEO_PACKAGES: ${{ github.event.inputs.nuxeo_packages || vars.NUXEO_PACKAGES }}
        run: npm run build

      - name: Set up Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@314c39e8c2e913db2dc63a31670612ccb2b6e569 # v0.10.4
        with:
          java-version: '17'

      - name: Build Web UI marketplace package
        # Reuses the dist/ produced by the Webpack build above (-DskipInstall -DskipBuild).
        # Rewrite the reactor version in the built poms (parent + addon + marketplace) to the
        # preview VERSION so the nuxeo-web-ui bundle (reported by /nuxeo/api/v1/management/distribution)
        # and the marketplace package both carry it — unique per run and matching the image tag.
        # A plain sed avoids the slow versions-maven-plugin resolution (~4 min per run).
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
        run: |
          BASE_VERSION="$(node -p 'require("./package.json").version')"
          for p in pom.xml plugin/web-ui/addon/pom.xml plugin/web-ui/marketplace/pom.xml; do
            sed -i "s|<version>${BASE_VERSION}</version>|<version>${VERSION}</version>|g" "$p"
          done
          mvn -B -ntp clean install -DskipTests -DskipInstall=true -DskipBuild=true

      - name: Stage Web UI marketplace package for offline install
        run: |
          mkdir -p local-modules
          cp plugin/web-ui/marketplace/target/nuxeo-web-ui-marketplace-*.zip local-modules/

      - name: Build and push combined Nuxeo + Web UI image
        id: build
        uses: nuxeo/gh-build-tools/.github/actions/nuxeo-docker-build@1b8eb07cc779f1c86ecaed70c021ab7c1f27b441 # v0.15.0
        with:
          base-image-tag: ${{ env.BASE_IMAGE_TAG }}
          base-registry-username: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          base-registry-password: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
          nuxeo-local-modules-path: local-modules
          # Connect server packages to pre-install; defaults to replace-administrator-user when NUXEO_SERVER_PACKAGES is unset.
          nuxeo-connect-modules: ${{ github.event.inputs.nuxeo_server_packages || vars.NUXEO_SERVER_PACKAGES || 'replace-administrator-user' }}
          nuxeo-connect-url: https://connect.nuxeo.com/nuxeo/site/
          nuxeo-clid: ${{ secrets.DEVOPS_CLID }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          registry-password: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}
          image-name: ${{ env.REPOSITORY }}
          image-tag: ${{ env.VERSION }}
          image-title: 'Nuxeo Web UI'
          platforms: linux/amd64
          push-image: 'true'

      - name: Set preview image reference
        id: preview
        run: |
          echo "image=${{ steps.build.outputs.image-url }}" >> $GITHUB_OUTPUT
          echo "PREVIEW_IMAGE=${{ steps.build.outputs.image-url }}" >> $GITHUB_ENV

      - uses: actions/github-script@v9.0.0
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:star: PR preview image published: \`${process.env.PREVIEW_IMAGE}\``
            })

  result:
    name: "Result: ${{ needs.preview.outputs.image }}"
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch'
    steps:
      - env:
          IMAGE: ${{ needs.preview.outputs.image }}
        run: echo "$IMAGE"
