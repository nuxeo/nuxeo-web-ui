name: Promote release test

on:
  pull_request:
    branches:
      - maintenance-3.1.x
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g.: 3.1.2-rc.2)'
        required: true
      referenceBranch:
        description: 'Branch to be updated after the promotion'
        required: true
        default: 'maintenance-3.1.x'
      dryRun:
        description: 'Run the workflow without pushing code or publishing artifacts'
        type: boolean
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PACKAGE: nuxeo-web-ui-3.1.18
      CONNECT_PREPROD_URL: https://nos-preprod-connect.nuxeocloud.com/nuxeo
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - uses: actions/checkout@v2
        with:
          ref: 'maintenance-3.1.x'
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Promote Web UI 3.1.18-rc.3 to 3.1.18
        run: |
          echo "Downloading package..."
          curl -o $PACKAGE.zip -L -u "${{ secrets.CONNECT_PREPROD_AUTH }}" "$CONNECT_PREPROD_URL/site/marketplace/package/nuxeo-web-ui/download?version=3.1.18-rc.003"

          echo "Unzipping package..."
          unzip -d $PACKAGE $PACKAGE.zip && rm $PACKAGE.zip
          pushd $PACKAGE

          echo "Removing RC suffix from package.xml..."
          sed -i 's/-rc\.[0-9]*//' package.xml

          echo "Processing JAR files..."
          for jarfile in install/bundles/*.jar; do
            tempdir=$(mktemp -d)
            unzip "$jarfile" -d "$tempdir"
            find "$tempdir/META-INF/maven" -type f \( -name "pom.xml" -o -name "pom.properties" \) -exec sed -i 's/-rc\.[0-9]*//' {} \;
            (cd "$tempdir" && zip -qr "$OLDPWD/$jarfile" .)
            rm -rf "$tempdir"
          done

          echo "Repackaging final .zip..."
          zip -qr ../$PACKAGE.zip .
          popd

          echo "Final package created: $PACKAGE.zip"
          echo "Listing files in workspace root:"
          ls -lah
          echo "Listing in PACKAGE directory:"
          ls -lah $PACKAGE
          echo "Listing zip file location:"
          ls -lah $PACKAGE.zip

      - name: Upload Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
