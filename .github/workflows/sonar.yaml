name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'

  push:
    branches:
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'

  workflow_dispatch:

  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

env:
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/
  # Branch this run targets. Used to pick the matching nuxeo-elements branch to build against.
  REFERENCE_BRANCH: ${{ github.base_ref || inputs.branch || github.ref_name }}

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}

      # Elements is built from the paired branch's source rather than resolved from the registry.
      # The registry lookup only ever matched `-rc` versions, which are published from the release
      # branches, so on a dev branch it resolved whichever release candidate happened to be newest
      # and never saw that cycle's Elements work. This is the same approach ftest.yaml and
      # cross-repo.yaml already use.
      - name: Determine nuxeo-elements branch to link
        id: pick_nuxeo_elements_branch
        uses: nuxeo/ui-team-gh-actions/get-branch@ca09d5c52a62e297502d3572c36d813be927982a
        with:
          repository: nuxeo/nuxeo-elements
          branch: ${{ env.REFERENCE_BRANCH }}
          default-branch: lts-2025

      - name: Checkout the nuxeo-elements repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Pack Elements modules
        run: |
          pushd nuxeo-elements
          for d in core ui dataviz testing-helpers; do
            pushd $d
            echo "ELEMENTS_$(echo $d | tr 'a-z-' 'A-Z_')=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
            popd
          done
          popd
        working-directory: ${{ github.workspace }}

      - name: Link elements to Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          # One invocation: the root preinstall hook runs npm ci in three subpackages, so
          # installing the tarballs one at a time repeats that work four times over.
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" \
            nuxeo-elements/core/${ELEMENTS_CORE} \
            nuxeo-elements/ui/${ELEMENTS_UI} \
            nuxeo-elements/dataviz/${ELEMENTS_DATAVIZ} \
            nuxeo-elements/testing-helpers/${ELEMENTS_TESTING_HELPERS}
        working-directory: ${{ github.workspace }}

      - name: Run unit tests with coverage
        # pretest installs Puppeteer Chromium (npm ci --ignore-scripts skips its postinstall).
        run: npm test
        working-directory: ${{ github.workspace }}

      - name: Resolve project version and branch
        id: project_meta
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # github.head_ref = PR source branch, github.ref_name = push branch,
          # inputs.branch = workflow_call. git HEAD is detached on PR/push events.
          echo "branch=${{ github.head_ref || github.ref_name || inputs.branch }}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Build and analyze
        id: sonar_scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.projectVersion=${{ steps.project_meta.outputs.version }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=false
            ${{ github.event_name == 'pull_request' &&
              format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                github.event.pull_request.number,
                github.event.pull_request.head.ref,
                github.event.pull_request.base.ref)
              || format('-Dsonar.branch.name={0}', steps.project_meta.outputs.branch) }}

      - name: Enforce Quality Gate
        # TODO: Temporarily non-blocking due to revert PR baseline issue. Revert to exit 1 once
        # SonarCloud new-code baseline resets (after next version bump or baseline reconfiguration).
        if: always()
        run: |
          if [ "${{ steps.sonar_scan.outcome }}" = "skipped" ]; then
            echo "⚠️ SonarCloud scan was skipped — a prior step (e.g. coverage baseline) failed."
          elif [ "${{ steps.sonar_scan.outcome }}" != "success" ]; then
            echo "⚠️ SonarCloud Quality Gate did not pass (non-blocking, baseline issue)."
            echo "   • New-code coverage must be ≥ 90 %"
            echo "   • No unresolved code-quality issues on new/changed code"
          else
            echo "✅ SonarCloud Quality Gate passed."
          fi