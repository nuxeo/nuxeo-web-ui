name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - lts-2025

  push:
    branches:
      - lts-2025

  workflow_dispatch:

  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}

      - name: Ensure latest @nuxeo RC packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          ELEMENTS_VERSION=$(
            for pkg in @nuxeo/nuxeo-elements @nuxeo/nuxeo-ui-elements @nuxeo/nuxeo-dataviz-elements @nuxeo/testing-helpers; do
              npm view "$pkg" versions --json | jq -r '.[]'
            done | grep -E "2025\.[0-9]+\.[0-9]+-rc\.[0-9]+$" \
                 | sort | uniq -c | awk '$1 == 4 {print $2}' | sort -V | tail -n1
          )
          echo "Resolved latest nuxeo-elements RC: $ELEMENTS_VERSION"
          if [ -z "$ELEMENTS_VERSION" ]; then
            echo "::error::Could not resolve a common RC version across all @nuxeo packages"
            exit 1
          fi

          npm install --no-package-lock \
            @nuxeo/nuxeo-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-ui-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-dataviz-elements@"$ELEMENTS_VERSION" \
            @nuxeo/testing-helpers@"$ELEMENTS_VERSION"
        working-directory: ${{ github.workspace }}

      - name: Run unit tests with coverage
        # pretest installs Puppeteer Chromium (npm ci --ignore-scripts skips its postinstall).
        run: npm test
        working-directory: ${{ github.workspace }}

      - name: Resolve project version and branch
        id: project_meta
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # github.head_ref = PR source branch, github.ref_name = push branch,
          # inputs.branch = workflow_call. git HEAD is detached on PR/push events.
          echo "branch=${{ github.head_ref || github.ref_name || inputs.branch }}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Build and analyze
        id: sonar_scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.projectVersion=${{ steps.project_meta.outputs.version }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
            ${{ github.event_name == 'pull_request' &&
              format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                github.event.pull_request.number,
                github.event.pull_request.head.ref,
                github.event.pull_request.base.ref)
              || format('-Dsonar.branch.name={0}', steps.project_meta.outputs.branch) }}

      - name: Enforce Quality Gate
        # Fails if sonar scan was skipped (e.g. prior step failed) or gate not passed.
        if: always()
        run: |
          if [ "${{ steps.sonar_scan.outcome }}" = "skipped" ]; then
            echo "❌ SonarCloud scan was skipped — a prior step (e.g. coverage baseline) failed."
            exit 1
          fi
          if [ "${{ steps.sonar_scan.outcome }}" != "success" ]; then
            echo "❌ SonarCloud Quality Gate FAILED. Fix flagged issues before merging."
            echo "   • New-code coverage must be ≥ 90 %"
            echo "   • No unresolved code-quality issues on new/changed code"
            exit 1
          fi
          echo "✅ SonarCloud Quality Gate passed."

      # SonarQube's compute engine drops a failing new_coverage / new_*_coverage /
      # new_duplicated_lines_* condition to OK when the changeset has fewer than 20 new
      # lines, and stamps the analysis "ignoredConditions": true. The cutoff is hardcoded
      # in the engine, so no gate condition or scanner property can override it — a small
      # PR merges at any coverage. This step re-derives each verdict from the comparator
      # and threshold the gate already published, so the gate stays the only place
      # thresholds are defined (WEBUI-2311).
      - name: Re-evaluate gate without the small-changeset exemption
        if: steps.sonar_scan.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          # Bind to the analysis this run produced. Querying by pullRequest or branch
          # would read that scope's latest analysis, which an overlapping synchronize run
          # can replace between the scan and this check.
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "❌ $report not found — cannot identify this run's analysis."
            exit 1
          fi

          ce_task_id=$(sed -n 's/^ceTaskId=//p' "$report")
          if [ -z "$ce_task_id" ]; then
            echo "❌ No ceTaskId in $report."
            exit 1
          fi

          task=$(curl -sSf -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/ce/task?id=${ce_task_id}")
          analysis_id=$(jq -r '.task.analysisId // empty' <<<"$task")
          if [ -z "$analysis_id" ]; then
            echo "❌ Task ${ce_task_id} finished as $(jq -r '.task.status // "UNKNOWN"' <<<"$task") without an analysis id."
            exit 1
          fi

          status=$(curl -sSf -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${analysis_id}")

          if [ "$(jq -r '.projectStatus.ignoredConditions' <<<"$status")" = "true" ]; then
            echo "::warning::SonarCloud ignored its coverage/duplication conditions on this changeset (under 20 new lines). Re-evaluating them here."
          fi

          # A condition with no measured value cannot be judged. For coverage that is
          # legitimate when the change adds no coverable line, but it does mean the 90%
          # bar went unapplied, so say so instead of reporting a clean pass.
          if ! jq -e '.projectStatus.conditions[]? | select(.metricKey == "new_coverage" and .actualValue != null)' >/dev/null <<<"$status"; then
            echo "::warning::No new_coverage measure on this analysis, so the 90% bar was not applied. Expected only when the change adds no coverable line (see sonar.coverage.exclusions)."
          fi

          violations=$(jq -r '
            .projectStatus.conditions[]
            | select(.actualValue != null)
            | select(
                (.comparator == "LT" and (.actualValue | tonumber) < (.errorThreshold | tonumber)) or
                (.comparator == "GT" and (.actualValue | tonumber) > (.errorThreshold | tonumber)))
            | "\(.metricKey) = \(.actualValue), fails \(.comparator) \(.errorThreshold)"' <<<"$status")

          if [ -n "$violations" ]; then
            echo "❌ Quality gate conditions are violated on new code:"
            printf '   • %s\n' "$violations"
            echo "   SonarCloud reported these as passing; see WEBUI-2311."
            exit 1
          fi
          echo "✅ Every condition with a measured value genuinely passes."
