name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - lts-2025

  workflow_dispatch:

  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        # npm install is required (not npm ci) because the preinstall script runs
        # npm install in sub-packages that do not have a package-lock.json
        run: npm install
        working-directory: ${{ github.workspace }}

      - name: Ensure latest @nuxeo RC packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          ELEMENTS_VERSION=$(npm view @nuxeo/nuxeo-ui-elements versions --json \
            | jq -r '.[]' \
            | grep -E "2025\.[0-9]+\.[0-9]+-rc\.[0-9]+$" \
            | sort -V | tail -n1)
          echo "Resolved latest nuxeo-elements RC: $ELEMENTS_VERSION"

          npm install \
            @nuxeo/nuxeo-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-ui-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-dataviz-elements@"$ELEMENTS_VERSION" \
            @nuxeo/testing-helpers@"$ELEMENTS_VERSION"
        working-directory: ${{ github.workspace }}

      - name: Run unit tests with coverage
        run: npm test
        working-directory: ${{ github.workspace }}

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
