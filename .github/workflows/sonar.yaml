name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - maintenance-3.1.x

  workflow_dispatch:

  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        # npm install is required (not npm ci) because the preinstall script runs
        # npm install in sub-packages that do not have a package-lock.json
        run: npm install
        working-directory: ${{ github.workspace }}

      - name: Ensure latest @nuxeo RC packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          ELEMENTS_VERSION=$(npm view @nuxeo/nuxeo-ui-elements versions --json \
            | jq -r '.[]' \
            | grep -E "3\.1\.[0-9]+-rc\.[0-9]+$" \
            | sort -V | tail -n1)
          echo "Resolved latest nuxeo-elements RC: $ELEMENTS_VERSION"

          npm install \
            @nuxeo/nuxeo-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-ui-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-dataviz-elements@"$ELEMENTS_VERSION" \
            @nuxeo/testing-helpers@"$ELEMENTS_VERSION"
        working-directory: ${{ github.workspace }}

      - name: Run unit tests with coverage
        run: npm test
        working-directory: ${{ github.workspace }}

      - name: Restore coverage baseline from target branch
        id: coverage_cache
        uses: actions/cache/restore@v5
        with:
          path: .coverage-baseline
          # Intentionally never matches exactly; restore-keys picks up the latest save.
          key: coverage-baseline-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            coverage-baseline-${{ github.base_ref || github.ref_name }}-

      - name: Enforce overall coverage baseline
        # Fails if total line coverage drops below the baseline saved from the last merge.
        # No cache on first run — baseline is seeded and enforcement starts from the next PR.
        run: |
          LCOV=coverage/lcov.info
          if [ ! -f "$LCOV" ]; then
            echo "❌ $LCOV not found — did the test step fail?"
            exit 1
          fi

          LINES_HIT=$(grep -E '^LH:' "$LCOV" | awk -F: '{s+=$2} END {print s+0}')
          LINES_FOUND=$(grep -E '^LF:' "$LCOV" | awk -F: '{s+=$2} END {print s+0}')

          if [ "$LINES_FOUND" -eq 0 ]; then
            echo "❌ Coverage report contains no line data."
            exit 1
          fi

          COVERAGE_FULL=$(echo "scale=2; $LINES_HIT * 100 / $LINES_FOUND" | bc)
          COVERAGE_INT=$(echo "$COVERAGE_FULL" | cut -d. -f1)

          echo "Overall line coverage: ${COVERAGE_FULL}% (lines hit: $LINES_HIT / found: $LINES_FOUND)"

          if [ "${{ steps.coverage_cache.outputs.cache-hit }}" != "true" ]; then
            echo "⚠️  No baseline found — seeding at ${COVERAGE_FULL}%. Enforcement starts next PR."
          else
            BASELINE=$(cat .coverage-baseline)
            echo "Baseline ('${{ github.base_ref || github.ref_name }}'): ${BASELINE}%"
            if [ "$COVERAGE_INT" -lt "$BASELINE" ]; then
              echo "❌ Coverage ${COVERAGE_FULL}% dropped below baseline ${BASELINE}%. Add tests and re-push."
              exit 1
            fi
            echo "✅ Coverage ${COVERAGE_FULL}% meets baseline ${BASELINE}%."
          fi

          echo "$COVERAGE_INT" > .coverage-baseline
        working-directory: ${{ github.workspace }}

      - name: Save coverage baseline
        # Runs on merges only (not PRs). run_id suffix ensures the key is always unique
        # (Actions cache keys are immutable — a static key silently skips re-saving).
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .coverage-baseline
          key: coverage-baseline-${{ github.ref_name }}-${{ github.run_id }}

      - name: Resolve project version and branch
        id: project_meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Build and analyze
        id: sonar_scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.projectVersion=${{ steps.project_meta.outputs.version }}
            -Dsonar.branch.name=${{ steps.project_meta.outputs.branch }}
            -Dsonar.scm.revision=${{ github.sha }}

      - name: Enforce Quality Gate
        # Fails if sonar scan was skipped (e.g. prior step failed) or gate not passed.
        if: always()
        run: |
          if [ "${{ steps.sonar_scan.outcome }}" = "skipped" ]; then
            echo "❌ SonarCloud scan was skipped — a prior step (e.g. coverage baseline) failed."
            exit 1
          fi
          if [ "${{ steps.sonar_scan.outcome }}" != "success" ]; then
            echo "❌ SonarCloud Quality Gate FAILED. Fix flagged issues before merging."
            echo "   • New-code coverage must be ≥ 90 %"
            echo "   • No unresolved code-quality issues on new/changed code"
            exit 1
          fi
          echo "✅ SonarCloud Quality Gate passed."
