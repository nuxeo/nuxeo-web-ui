name: Test

on:
  pull_request:
    branches:
      - lts-2025
  workflow_call:
    inputs:
      branch:
        description: 'Branch to test'
        default: lts-2025
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SAUCE_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'lts-2025' }}

jobs:
  unit-test:
    runs-on:
      group: medium-4cpu-runners  
    steps:
      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'
          node-version: 22

      - name: delete cache
        run: npm cache clean -f

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          npm cache clean --force
          npm install

      - name: Unit tests
        # Disabling SauceLabs. Karma is not compatible with SauceLabs v4
        # env:
        #   SAUCE_USERNAME: nuxeo-web-ui
        #   SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: npm run test
