name: Test

on:
  pull_request:
    branches:
      - lts-2025
      - 'develop-20[0-9][0-9]'

  workflow_call:
    inputs:
      branch:
        description: 'Branch to test'
        default: lts-2025
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SAUCE_ACCESS_KEY:
        required: false

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'lts-2025' }}
  # Branch this PR targets. Used to pick the matching nuxeo-elements branch to build against.
  REFERENCE_BRANCH: ${{ github.base_ref || inputs.branch || 'lts-2025' }}
  NPM_REPOSITORY: https://packages.nuxeo.com/repository/npm-public/

jobs:
  unit-test:
    runs-on:
      group: medium-4cpu-runners
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      # Elements is built from the paired branch's source rather than resolved from the registry.
      # The registry lookup only ever matched `-rc` versions, which are published from the release
      # branches, so on a dev branch it resolved whichever release candidate happened to be newest
      # and never saw that cycle's Elements work. This is the same approach ftest.yaml and
      # cross-repo.yaml already use.
      - name: Determine nuxeo-elements branch to link
        id: pick_nuxeo_elements_branch
        uses: nuxeo/ui-team-gh-actions/get-branch@ca09d5c52a62e297502d3572c36d813be927982a
        with:
          repository: nuxeo/nuxeo-elements
          branch: ${{ env.REFERENCE_BRANCH }}
          default-branch: lts-2025

      - name: Checkout the nuxeo-elements repo
        uses: actions/checkout@v6
        with:
          repository: nuxeo/nuxeo-elements
          path: nuxeo-elements
          fetch-depth: 1
          ref: ${{ steps.pick_nuxeo_elements_branch.outputs.branch }}

      - name: Pack Elements modules
        run: |
          pushd nuxeo-elements
          for d in core ui dataviz testing-helpers; do
            pushd $d
            echo "ELEMENTS_$(echo $d | tr 'a-z-' 'A-Z_')=$(npm pack 2>&1 | tail -1)" >> $GITHUB_ENV
            popd
          done
          popd

      - name: Link elements to Web UI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          # One invocation: the root preinstall hook runs npm ci in three subpackages, so
          # installing the tarballs one at a time repeats that work four times over.
          npm install --no-package-lock --@nuxeo:registry="${{ env.NPM_REPOSITORY }}" \
            nuxeo-elements/core/${ELEMENTS_CORE} \
            nuxeo-elements/ui/${ELEMENTS_UI} \
            nuxeo-elements/dataviz/${ELEMENTS_DATAVIZ} \
            nuxeo-elements/testing-helpers/${ELEMENTS_TESTING_HELPERS}

      - name: Unit tests
        # pretest installs Puppeteer Chromium (npm ci --ignore-scripts skips its postinstall).
        # npm test: regenerate barrels, print WTR layout notice, then web-test-runner --coverage.
        # WTR reports "1/1 test files" (load-all-tests.js); Mocha pass/fail counts are individual tests.
        run: npm run test