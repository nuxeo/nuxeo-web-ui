name: Test

on:
  pull_request:
    branches:
      - lts-2025

  workflow_call:
    inputs:
      branch:
        description: 'Branch to test'
        default: lts-2025
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SAUCE_ACCESS_KEY:
        required: false

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'lts-2025' }}

jobs:
  unit-test:
    runs-on:
      group: medium-4cpu-runners
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/nuxeo-web-ui-ftest/package.json', 'packages/nuxeo-designer-catalog/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Ensure latest @nuxeo RC packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: |
          ELEMENTS_VERSION=$(
            for pkg in @nuxeo/nuxeo-elements @nuxeo/nuxeo-ui-elements @nuxeo/nuxeo-dataviz-elements @nuxeo/testing-helpers; do
              npm view "$pkg" versions --json | jq -r '.[]'
            done | grep -E "2025\.[0-9]+\.[0-9]+-rc\.[0-9]+$" \
                 | sort | uniq -c | awk '$1 == 4 {print $2}' | sort -V | tail -n1
          )
          echo "Resolved latest nuxeo-elements RC: $ELEMENTS_VERSION"
          if [ -z "$ELEMENTS_VERSION" ]; then
            echo "::error::Could not resolve a common RC version across all @nuxeo packages"
            exit 1
          fi

          npm install --no-package-lock \
            @nuxeo/nuxeo-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-ui-elements@"$ELEMENTS_VERSION" \
            @nuxeo/nuxeo-dataviz-elements@"$ELEMENTS_VERSION" \
            @nuxeo/testing-helpers@"$ELEMENTS_VERSION"

      - name: Install Chromium for Web Test Runner
        # npm ci --ignore-scripts skips puppeteer's browser download; WTR uses bundled Chromium.
        run: npx puppeteer browsers install chrome

      - name: Unit tests
        # npm test: regenerate barrels, print WTR layout notice, then web-test-runner --coverage.
        # WTR reports "1/1 test files" (load-all-tests.js); Mocha pass/fail counts are individual tests.
        run: npm run test