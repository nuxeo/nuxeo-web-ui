name: Veracode Vulnerability Scan

on:
  push:
    branches:
      - 'fix-WEBUI-1790-form-data-vulnerability'
  schedule:
    - cron: '30 12 1,15 * *' # Runs at 5:30 PM IST on 1st & 15th
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '21'

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🛠️ Install dependencies
        run: |
          npm ci  # or yarn install --frozen-lockfile if using yarn

      - name: 🧪 Run build (if needed)
        run: |
          npm run build  # change this to your actual build command

      - name: 📦 Zip build artifacts for Veracode
        run: |
          mkdir -p veracode-artifact
          zip -r veracode-artifact/artifact.zip . -x "**/node_modules/**"

      - name: 🚀 Upload to Veracode
        uses: veracode/veracode-upload-and-scan-action@v1.0.6
        with:
          appname: 'YourAppNameHere'
          filepath: 'veracode-artifact/artifact.zip'
          version: '${{ github.run_number }}-${{ github.ref_name }}'
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          createprofile: true
          scanpollinginterval: 60
          scantimeout: 60
