<!--
`nuxeo-browser`
@group Nuxeo UI
@element nuxeo-browser
-->
<dom-module id="nuxeo-browser">
  <template>
    <style include="nuxeo-styles">
      /* document actions */
      .document-actions {
        /* To represent accurate clientWidth in Safari */
        overflow-y: hidden;
        height: var(--nuxeo-drawer-header-height);
      }

      .document-actions paper-icon-button {
        @apply --nuxeo-action;
      }

      .document-actions paper-icon-button:hover {
        @apply --nuxeo-action-hover;
      }

      paper-tabs {
        --paper-tabs-selection-bar-color: transparent;
        height: auto;
        min-height: 44px;
        font-size: inherit;
        font-weight: 400;
      }

      nuxeo-breadcrumb {
        max-width: calc(100% - var(--nuxeo-browser-actions-menu-max-width, 240px));
      }

      nuxeo-actions-menu {
        height: 100%;
        max-width: var(--nuxeo-browser-actions-menu-max-width, 240px);
      }

      /* Apply Hyland branding to the page header, toolbar, and surrounding surfaces when the rebrand attribute is set. */
      :host([rebrand]) {
        --nuxeo-page-host-background: var(--hyland-page-surface-background, transparent);
        --nuxeo-page-content-background: var(--hyland-page-surface-background, transparent);
        --nuxeo-page-toolbar-background: var(--hyland-app-header-background, var(--nuxeo-app-header-background));
        --nuxeo-page-toolbar-box-shadow: var(--hyland-app-header-shadow, var(--nuxeo-app-header-box-shadow));
      }

      /* Document listing (folder or collection): floating card (rounded tabs on top, rounded content below, inset). */
      :host([document-facets~='Folderish'][rebrand]) nuxeo-page,
      :host([document-facets~='Collection'][rebrand]) nuxeo-page {
        --nuxeo-page-tabs-background: var(--hyland-nuxeo-card-background, var(--nuxeo-app-header-background));
        --nuxeo-page-tabs-box-shadow: var(--hyland-page-tabs-box-shadow, var(--nuxeo-app-header-box-shadow));
        --nuxeo-page-tabs-border-radius: var(--hyland-browser-tabs-border-radius, 0);
        --nuxeo-page-tabs-margin: var(--hyland-browser-tabs-margin, 1px 0 0 0);
        --nuxeo-page-content-background: var(--hyland-nuxeo-card-background, transparent);
        --nuxeo-page-content-border-radius: var(--hyland-browser-content-border-radius, 0);
        --nuxeo-page-content-margin: var(--hyland-browser-content-margin, 0);
        --nuxeo-page-content-padding: var(--hyland-browser-content-padding, 16px 16px 0 16px);
      }

      /* Single document view page (not a folder or collection): ensures visual continuity by applying
         the same background color to tabs as the toolbar, and removes shadows to prevent visual seams
         between the toolbar and tab surfaces. */
      :host([rebrand]:not([document-facets~='Folderish']):not([document-facets~='Collection'])) nuxeo-page {
        --nuxeo-page-tabs-background: var(--hyland-page-tabs-background, var(--nuxeo-app-header-background));
        --nuxeo-page-tabs-box-shadow: var(--hyland-page-tabs-box-shadow, var(--nuxeo-app-header-box-shadow));
        --nuxeo-page-content-padding: var(--hyland-browser-document-content-padding, 16px 16px 0 16px);
      }
    </style>

    <!-- Main content -->
    <nuxeo-page class="main">
      <div slot="header">
        <nuxeo-repositories></nuxeo-repositories>
        <nuxeo-breadcrumb document="[[document]]"></nuxeo-breadcrumb>
        <template is="dom-if" if="[[!isTrashed(document)]]">
          <div class="document-actions">
            <nuxeo-actions-menu>
              <nuxeo-slot name="DOCUMENT_ACTIONS" model="[[actionContext]]"></nuxeo-slot>
            </nuxeo-actions-menu>
          </div>
        </template>
      </div>
      <div slot="tabs">
        <paper-tabs
          autoselect
          attr-for-selected="name"
          id="documentViewsItems"
          noink
          no-slide
          selected="{{selectedTab}}"
          selectable="nuxeo-page-item"
        >
          <nuxeo-slot name="DOCUMENT_VIEWS_ITEMS" model="[[viewsContext]]"></nuxeo-slot>
        </paper-tabs>
      </div>
      <div>
        <div id="nxContent">
          <iron-pages selected="[[selectedTab]]" attr-for-selected="name" selected-attribute="visible">
            <nuxeo-slot name="DOCUMENT_VIEWS_PAGES" model="[[viewsContext]]"></nuxeo-slot>
          </iron-pages>
        </div>
      </div>
    </nuxeo-page>
  </template>

  <script>
    Polymer({
      is: 'nuxeo-browser',
      behaviors: [Nuxeo.RoutingBehavior, Nuxeo.I18nBehavior, Nuxeo.FiltersBehavior, Nuxeo.BrandingBehavior],
      properties: {
        document: {
          type: Object,
          observer: '_documentChanged',
        },
        selectedTab: {
          type: String,
          value: 'view',
          notify: true,
          observer: '_updateUrl',
        },
        cvParams: {
          type: Object,
          notify: true,
        },
        clipboard: {
          type: Object,
        },
        actionContext: {
          type: Object,
          computed: '_actionContext(document, clipboard)',
        },
        viewsContext: {
          type: Object,
          computed: '_viewsContext(document)',
        },
      },

      listeners: {
        aceupdated: '_documentUpdated',
        acedeleted: '_documentUpdated',
        'added-to-collection': '_documentUpdated',
        'removed-from-collection': '_documentUpdated',
      },

      _documentUpdated() {
        this.fire('document-updated');
      },

      /* Reflect the document's facets onto an attribute so the branding CSS above can
       distinguish document listings (folder or collection) from single-document views.
       */
      _documentChanged() {
        if (this.document && this.document.facets) {
          this.setAttribute('document-facets', this.document.facets.join(' '));
        } else {
          this.removeAttribute('document-facets');
        }
      },

      download() {
        window.location.href = this.document.properties['file:content'].data;
      },

      get _enrichers() {
        return this.document && this.document.contextParameters;
      },

      get _canReadChildren() {
        return this._enrichers && this._enrichers.permissions.indexOf('ReadChildren') !== -1;
      },

      _actionContext() {
        return { document: this.document, clipboard: this.clipboard };
      },

      _viewsContext() {
        return { document: this.document };
      },

      _navigateToView() {
        this.navigateTo(this.document);
      },

      _updateUrl() {
        const currentUrl = window.location.href;
        let newUrl;
        const queryParamsIdx = currentUrl.lastIndexOf('?');
        let queryParams;
        if (queryParamsIdx > -1) {
          newUrl = currentUrl.slice(0, queryParamsIdx);
          queryParams = new URLSearchParams(currentUrl.substring(queryParamsIdx));
        } else {
          newUrl = currentUrl;
          queryParams = new URLSearchParams();
        }
        // remove 'p' queryParam if current tab is the default one
        if (this.selectedTab === this.properties.selectedTab.value) {
          queryParams.delete('p');
        } else {
          queryParams.set('p', this.selectedTab);
        }
        if (queryParams.toString().length > 0) {
          newUrl += `?${queryParams.toString()}`;
        }
        if (newUrl !== currentUrl) {
          window.history.pushState(null, window.title, newUrl);
        } else {
          window.history.replaceState(null, window.title, newUrl);
        }
      },
    });
  </script>
</dom-module>
