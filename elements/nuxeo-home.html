<!--
`nuxeo-home`
@group Nuxeo UI
@element nuxeo-home
-->
<dom-module id="nuxeo-home">
  <template>
    <style include="nuxeo-styles">
      /* When rebrand flag is set, apply Hyland branding variables that cascade to nested <nuxeo-page> instances. */
      :host([rebrand]) {
        --nuxeo-page-host-background: var(--hyland-page-surface-background, transparent);
        --nuxeo-page-content-background: var(--hyland-page-surface-background, transparent);
        --nuxeo-page-toolbar-background: var(--hyland-app-header-background, var(--nuxeo-app-header-background));
        --nuxeo-page-toolbar-box-shadow: var(--hyland-app-header-shadow, var(--nuxeo-app-header-box-shadow));
      }

      .dashboard {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      /* Dashboard background: uses Hyland branding colors when rebranded, falls back to classic theme. */
      :host([rebrand]) .dashboard {
        background-color: var(--hyland-page-surface-background, var(--nuxeo-app-content-background));
      }

      nuxeo-card {
        min-width: 25em;
        width: 49%;
        border-radius: 12px;
      }

      @media (max-width: 1024px) {
        nuxeo-card {
          width: 100%;
        }
      }

      nuxeo-data-table,
      nuxeo-data-list {
        height: 350px;
        min-height: auto;
      }

      nuxeo-data-table {
        --hyland-data-table-row-border: none;
      }

      .ellipsis {
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        display: block;
        width: calc(100% - 38px);
      }

      .task-box {
        line-height: 155%;
      }

      .task-box + .task-box {
        border-top: 1px solid var(--divider-color);
      }

      .task-due-date {
        opacity: 0.5;
        margin-right: 0.5rem;
      }

      .taskDoc .doc-title,
      .date {
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 85%;
        overflow: hidden;
      }

      .date {
        color: var(--nuxeo-warn-text);
      }

      .list-item {
        cursor: pointer;
        padding: 1em;
      }

      .list-item:hover {
        @apply --nuxeo-block-hover;
      }

      .list-item:focus {
        outline: 0;
      }

      .task-name {
        font-weight: bold;
      }

      .horizontal {
        @apply --layout-horizontal;
        @apply --layout-center;
      }

      /* NXENG-527: Home dashboard header: Applicable for all themes. */
      .header {
        @apply --hyland-section-header;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* NXENG-527: Align wordmark logo to the trailing edge in rebranded themes, with RTL support. */
      :host([rebrand]) .header-logo {
        margin-inline-start: auto;
        margin-inline-end: 58px;
      }
    </style>

    <nuxeo-connection id="nx"></nuxeo-connection>
    <nuxeo-page>
      <div slot="header" class="header">
        <nuxeo-repositories></nuxeo-repositories>
        [[i18n('home.dashboard')]]
        <template is="dom-if" if="[[rebrand]]">
          <div class="header-logo">
            <!--
              Only render the image when a wordmark URL string is available.
              Note: this only guards against an empty URL (e.g. when getValidTheme is
              unavailable); it does not verify the file exists. In rebrand mode with a
              theme lacking hyland-wordmark.svg, the request still fires and on-error
              hides the broken image.
            -->
            <template is="dom-if" if="[[_wordmarkLogoUrl]]">
              <img
                src="[[_wordmarkLogoUrl]]"
                alt="[[i18n('app.brandedProductName')]]"
                width="110"
                height="20"
                hidden$="[[_wordmarkHidden]]"
                on-error="_onWordmarkError"
                on-load="_onWordmarkLoad"
              />
            </template>
          </div>
        </template>
      </div>
      <div>
        <section name="dashboard" class="dashboard">
          <!-- recently edited -->
          <nuxeo-card icon="nuxeo:edit" heading="[[i18n('home.latestDocumentsEdited')]]">
            <nuxeo-page-provider
              id="latestQuery"
              page-size="20"
              provider="domain_documents"
              schemas="dublincore,common,uid"
              enrichers="thumbnail"
              params='{"queryParams": "/"}'
              headers='{"fetch-document": "properties"}'
            >
            </nuxeo-page-provider>
            <nuxeo-data-table
              id="latestEditedDocs"
              wrapper-height="350px"
              max-items="15"
              nx-provider="latestQuery"
              empty-label="[[i18n('queryWidget.noDocuments')]]"
              on-row-clicked="_navigate"
              caption-text="[[i18n('table.caption.recentlyEditedDocs')]]"
            >
              <nuxeo-data-table-column name="[[i18n('documentContentView.datatable.header.title')]]" flex="100">
                <template>
                  <nuxeo-document-thumbnail document="[[item]]"></nuxeo-document-thumbnail>
                  <a class="ellipsis" href$="[[urlFor(item)]]">[[item.title]]</a>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column name="[[i18n('documentContentView.datatable.header.modified')]]" flex="50">
                <template>
                  <nuxeo-date datetime="[[item.properties.dc:modified]]" format="relative"></nuxeo-date>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column
                name="[[i18n('documentContentView.datatable.header.lastContributor')]]"
                flex="50"
              >
                <template>
                  <nuxeo-user-tag user="[[item.properties.dc:lastContributor]]"></nuxeo-user-tag>
                </template>
              </nuxeo-data-table-column>
            </nuxeo-data-table>
          </nuxeo-card>

          <!-- tasks -->
          <nuxeo-card icon="nuxeo:tasks" heading="[[i18n('home.tasks')]]">
            <nuxeo-task-page-provider id="tasksProvider" page-size="20"></nuxeo-task-page-provider>
            <nuxeo-data-list
              nx-provider="tasksProvider"
              id="tasksList"
              wrapper-height="350px"
              as="task"
              max-items="15"
              empty-label="[[i18n('tasksList.noTasks')]]"
              select-on-tap
              selection-enabled
              selected-item="{{_selection}}"
            >
              <template>
                <div tabindex$="{{tabIndex}}" class="list-item">
                  <div class="task-box">
                    <div class="horizontal layout center">
                      <span class="task-name">[[i18n(task.name)]]</span>
                    </div>
                    <div class="taskDoc horizontal">
                      <span class="doc-title">[[task.targetDocumentIds.0.title]]</span>
                    </div>
                    <div class="horizontal">
                      <span class="task-due-date">[[i18n('tasksList.dueDate')]]</span>
                      <span class="date">
                        <nuxeo-date datetime="[[task.dueDate]]" format="relative"></nuxeo-date>
                      </span>
                    </div>
                    <div class="horizontal">
                      <span>[[i18n(task.workflowModelName)]]</span>
                    </div>
                  </div>
                </div>
              </template>
            </nuxeo-data-list>
          </nuxeo-card>

          <!-- recently viewed -->
          <nuxeo-card icon="nuxeo:recent" heading="[[i18n('app.recentlyViewed')]]">
            <nuxeo-document-storage
              id="recentStorage"
              name="nuxeo-recent-documents"
              documents="{{_recentDocuments}}"
            ></nuxeo-document-storage>
            <nuxeo-page-provider id="recentProvider" page-size="15" schemas="uid"></nuxeo-page-provider>
            <nuxeo-data-table
              id="latestViewedDocs"
              wrapper-height="350px"
              max-items="15"
              empty-label="[[i18n('recentDocuments.empty')]]"
              empty-label-when-filtered="[[i18n('recentDocuments.empty')]]"
              on-row-clicked="_navigate"
              caption-text="[[i18n('table.caption.recentlyViewedDocs')]]"
            >
              <nuxeo-data-table-column name="[[i18n('documentContentView.datatable.header.title')]]" flex="100">
                <template>
                  <nuxeo-document-thumbnail document="[[item]]"></nuxeo-document-thumbnail>
                  <a class="ellipsis" href$="[[urlFor(item)]]">[[item.title]]</a>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column name="[[i18n('recentDocumentsTable.type')]]" flex="50">
                <template>
                  <nuxeo-tag>[[formatDocType(item.type)]]</nuxeo-tag>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column name="[[i18n('recentDocumentsTable.lastViewed')]]" flex="50">
                <template>
                  <nuxeo-date datetime="[[item.lastViewed]]" format="relative"></nuxeo-date>
                </template>
              </nuxeo-data-table-column>
            </nuxeo-data-table>
          </nuxeo-card>

          <!-- favorites -->
          <nuxeo-card icon="nuxeo:favorites" heading="[[i18n('home.favorites')]]">
            <nuxeo-operation id="fetchFavOp" op="Favorite.Fetch" response="favorite"></nuxeo-operation>
            <nuxeo-page-provider
              id="favoritesProvider"
              provider="default_content_collection"
              page-size="20"
              schemas="dublincore,common,uid"
              headers='{"fetch-document": "properties"}'
              enrichers="thumbnail"
            >
            </nuxeo-page-provider>
            <nuxeo-data-table
              id="favoriteDocs"
              wrapper-height="350px"
              max-items="15"
              nx-provider="favoritesProvider"
              empty-label="[[i18n('favorites.empty')]]"
              on-row-clicked="_navigate"
              caption-text="[[i18n('table.caption.favoriteDocs')]]"
            >
              <nuxeo-data-table-column name="[[i18n('documentContentView.datatable.header.title')]]" flex="100">
                <template>
                  <nuxeo-document-thumbnail document="[[item]]"></nuxeo-document-thumbnail>
                  <a class="ellipsis" href$="[[urlFor(item)]]">[[item.title]]</a>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column name="[[i18n('documentContentView.datatable.header.modified')]]" flex="50">
                <template>
                  <nuxeo-date datetime="[[item.properties.dc:modified]]" format="relative"></nuxeo-date>
                </template>
              </nuxeo-data-table-column>
              <nuxeo-data-table-column
                name="[[i18n('documentContentView.datatable.header.lastContributor')]]"
                flex="50"
              >
                <template>
                  <nuxeo-user-tag user="[[item.properties.dc:lastContributor]]"></nuxeo-user-tag>
                </template>
              </nuxeo-data-table-column>
            </nuxeo-data-table>
          </nuxeo-card>
        </section>
      </div>
    </nuxeo-page>
  </template>

  <script>
    Polymer({
      is: 'nuxeo-home',
      behaviors: [Nuxeo.RoutingBehavior, Nuxeo.FormatBehavior, Nuxeo.BrandingBehavior],
      properties: {
        visible: {
          type: Boolean,
          observer: '_visibleChanged',
        },

        _recentDocuments: {
          type: Array,
          value: [],
          observer: '_recentDocumentsChanged',
        },

        // Indicates if wordmark image failed to load and is hidden.
        _wordmarkHidden: {
          type: Boolean,
          value: false,
        },

        // NXENG-527: Wordmark logo URL, cached in ready() to avoid repeated lookups.
        // Theme changes require a full page reload, so caching is safe.
        _wordmarkLogoUrl: {
          type: String,
        },
      },

      ready() {
        if (!this.hasAttribute('dir')) {
          this.setAttribute('dir', getComputedStyle(this).direction);
        }
        this._wordmarkLogoUrl = this.getWordmarkLogo();
      },

      observers: ['_processTask(_selection)'],

      _processTask() {
        if (this._selection) {
          this.fire('navigate', {
            task: this._selection,
            index: this.$.tasksList._selectedItemIndex(),
            params: { offset: this.$.tasksProvider.offset, pageSize: this.$.tasksProvider.pageSize },
          });
        }
      },

      _visibleChanged(visible) {
        if (visible) {
          this._refresh();
        }
      },

      getWordmarkLogo() {
        /* Returns the wordmark SVG path for the current theme, or empty string if unavailable. */
        const getValidTheme = Nuxeo.UI && Nuxeo.UI.getValidTheme;
        return getValidTheme ? `themes/${getValidTheme()}/hyland-wordmark.svg` : '';
      },

      /* Hide wordmark if the image fails to load to prevent broken icon display. */
      _onWordmarkError() {
        this._wordmarkHidden = true;
      },

      /* Show the wordmark when the image loads successfully. */
      _onWordmarkLoad() {
        this._wordmarkHidden = false;
      },

      _refresh() {
        this.$.latestEditedDocs.fetch();
        this.$.nx.connect().then((user) => {
          this.$.tasksProvider.params = {
            userId: user.id,
          };
          this.$.tasksList.fetch();
        });
        this.$.recentStorage.reload();
        this._fetchFavorite().then((favorite) => {
          if (!(favorite && favorite.uid)) {
            return;
          }

          this.$.favoritesProvider.params = [favorite.uid];
          this.$.favoritesProvider.page = 1;
          this.$.favoriteDocs.fetch();
        });
      },

      _navigate(e) {
        let detail;
        if (e.detail.item) {
          detail = {
            doc: e.detail.item,
          };
          this.navigateTo(detail.doc);
        } else {
          detail = {
            doc: e.model.item,
          };
        }
        this.fire('navigate', detail);
      },

      _fetchFavorite() {
        if (this.favorite) {
          return Promise.resolve(this.favorite);
        }
        return this.$.fetchFavOp.execute().then((resp) => {
          this.favorite = resp;
          return resp;
        });
      },

      _recentDocumentsChanged(docs) {
        if (docs && docs.length > 0) {
          const storage = this.$.recentStorage;
          const provider = this.$.recentProvider;
          const ids = docs.map((doc) => `'${doc.uid}'`).join(',');
          provider.query = `SELECT * FROM Document WHERE ecm:uuid IN (${ids}) AND ecm:isTrashed = 0`;
          provider.fetch().then((result) => {
            docs.forEach((doc) => {
              if (!result.entries.some((entry) => entry.uid === doc.uid)) {
                storage.remove(doc);
              }
            });
            this.$.latestViewedDocs.items = docs;
            this.$.latestViewedDocs.notifyResize(); // XXX: force rendering for Edge (NXP-26244)
          });
        }
      },
    });
  </script>
</dom-module>
