sonar.projectKey=nuxeo_nuxeo-web-ui
sonar.projectName=Nuxeo Web UI
sonar.organization=nuxeo

# JS/HTML front-end sources
sonar.sources=elements,addons,themes,i18n,index.js,legacy.js,.github

# Test files (root + addon test directories)
sonar.tests=\
  test,\
  addons/nuxeo-csv/test,\
  addons/nuxeo-drive/test,\
  addons/nuxeo-liveconnect/test,\
  addons/nuxeo-template-rendering/test,\
  addons/nuxeo-wopi/test

# Coverage report from Web Test Runner + Istanbul
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File extensions to include
sonar.inclusions=**/*.js,**/*.html,**/*.json,**/*.css,**/*.yaml,**/*.yml

# Exclude build output, node_modules, generated files, vendor and coverage
#
# addons/nuxeo-platform-3d/loaders/** and .../controls/** are vendored third-party code: the
# glTF 1.0 loader utilities and OrbitControls taken verbatim from three.js r81 (v0.81.0)
# examples/js, kept when the npm three dependency was upgraded (see WEBUI-237 and the READMEs in
# both directories). Modern three.js no longer ships these ES5 example scripts and its current
# GLTFLoader cannot read glTF 1.0, so nuxeo-3d-viewer still needs the r81 copies for documents
# whose transmission format is "complete". They keep their upstream authorship headers and are
# not Nuxeo-authored: patching them to satisfy a linter would fork an upstream file permanently
# and make any future refresh harder, so they are deliberately not analysed. See WEBUI-2231.
#
# Scoped to loaders/ and controls/ only — the rest of the addon (elements/, document/, index.js)
# is Nuxeo-authored and stays in analysis. Coverage is unaffected: the whole addon is already
# outside the coverage denominator via addons/nuxeo-platform-3d/** in sonar.coverage.exclusions
# below, so this changes no coverage metric and cannot move the quality gate.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.tmp/**,\
  **/.scannerwork/**,\
  **/target/**,\
  **/coverage/**,\
  **/vendor/**,\
  scripts/**,\
  plugin/**,\
  ftest/**,\
  packages/**,\
  charts/**,\
  server/**,\
  addons/**/vendor/**,\
  addons/**/webpack.config.js,\
  addons/nuxeo-platform-3d/loaders/**,\
  addons/nuxeo-platform-3d/controls/**,\
  i18n/**/*.json

# Exclude files from coverage metrics that cannot be practically covered by unit tests.
#
# Categories:
#  - Test files themselves
#  - HTML files (**.html) — while many contain inline <script> with executable Polymer logic,
#    Istanbul does not instrument <script> blocks inside HTML via the test runner pipeline;
#    only standalone .js modules are instrumented for coverage
#  - CSS / JSON / YAML — no executable code
#  - Root-level bootstrap files (index.js, legacy.js, public-path.js, sw.js) — app entry points
#    and service worker that require a full browser bootstrap context
#  - elements/routing.js — runs Page.js route setup at import time, requires Nuxeo.UI app shell
#  - elements/elements.js — side-effect import barrel (no exportable logic, just registers elements)
#  - i18n/i18n.js — i18n bootstrap loader
#  - themes/*.html — covered by **/*.html above; themes/base.js and themes/loader.js have
#    unit tests and remain in coverage scope
#  - Addon index.js barrel files — side-effect registrations / re-exports
#  - nuxeo-spreadsheet/app/ — only files deeply coupled to jQuery/Handsontable/Select2 at import time:
#    app.js (imports vendor), lib/ (patches Handsontable prototype), ui/spreadsheet.js (jQuery container),
#    ui/editors/ (extend Select2Editor). Testable modules NOT excluded: utils.js, nuxeo/rest/*,
#    nuxeo/rpc/*, nuxeo/widget.js, ui/i18n.js, ui/column.js, ui/widgets.js, ui/log.js
#  - nuxeo-spreadsheet build config (webpack.config.js, eslint-rules.mjs)
#  - nuxeo-platform-3d/ — THREE.js loaders/controls break ESM bulk import; elements depend on them
#  - .github/ — CI workflow YAML/JS, not application code
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.html,\
  **/*.css,\
  **/*.yaml,\
  **/*.yml,\
  **/*.json,\
  index.js,\
  legacy.js,\
  public-path.js,\
  sw.js,\
  elements/routing.js,\
  elements/elements.js,\
  i18n/i18n.js,\
  addons/*/index.js,\
  addons/nuxeo-spreadsheet/app/app.js,\
  addons/nuxeo-spreadsheet/app/lib/**,\
  addons/nuxeo-spreadsheet/app/ui/spreadsheet.js,\
  addons/nuxeo-spreadsheet/app/ui/editors/**,\
  addons/nuxeo-spreadsheet/webpack.config.js,\
  addons/nuxeo-spreadsheet/eslint-rules.mjs,\
  addons/nuxeo-platform-3d/**,\
  .github/**

# Exclude theme files from copy/paste (duplication) detection.
# Each themes/**/theme.html is a flat map of CSS custom properties. Every theme must declare the
# same token names (values differ per theme), and the license header is identical across files, so
# CPD reports the parallel structure as duplication. Splitting these declarative token lists across
# files purely to satisfy CPD would hurt readability, so the token maps are excluded from CPD only.
sonar.cpd.exclusions=themes/**/theme.html

# Treat test/**/*.test.js and addon test files as test code, not source
sonar.test.inclusions=test/**/*.test.js,addons/*/test/**/*.test.js

sonar.sourceEncoding=UTF-8

# Block PR merge on Quality Gate failure.
# Gate conditions (set in SonarCloud UI, new code only):
#   Coverage >= 90%, Issues == 0, Hotspots reviewed == 100%, Duplications <= 3%
# Note: sonar.qualitygate.wait is set via workflow args to ensure it applies in all scan modes.

# Suppress javascript:S3776 ("Cognitive Complexity of functions should not be too high") on the
# two spreadsheet modules that are coupled to a third-party library at import time. See WEBUI-2250
# for the decision this implements. Between them these two paths account for four of the project's
# S3776 findings: editors/directory.js (35) and spreadsheet.js (38, 21, 19).
#
# These are the same paths already listed in sonar.coverage.exclusions above, and for the same
# structural reason: nuxeo-spreadsheet/app/ui/editors/ extend Select2Editor and ui/spreadsheet.js
# owns the jQuery/Handsontable container. Neither can be instantiated under the unit-test harness
# without first standing up the vendor globals, so a refactor there cannot be backed by a test
# proving it behaviour-preserving — and Sonar's estimate for the heaviest function is 28min,
# against a constructor whose correctness gates the widget type of every spreadsheet column.
#
# Restructuring untestable code to lower a metric trades real regression risk for no functional
# gain, so the complexity is recorded and accepted here rather than refactored. The findings in
# code that unit tests *do* cover were refactored instead, in this same change — and one of them was
# masking a real defect (an absent grid line interpolated into a `grid-column` shorthand).
#
# Scoped to these two paths and to S3776 alone, deliberately narrower than raising the threshold
# in the shared quality profile, which would lower the bar for new complexity everywhere. The cost
# accepted here is that new complexity inside these two paths will not be flagged either.
#
# Numbering starts at e2: e1 is reserved for the css:S4667 entry in the in-review WEBUI-2247
# branch, so the two changes merge without renumbering whichever lands second.
sonar.issue.ignore.multicriteria=e2,e3
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=addons/nuxeo-spreadsheet/app/ui/editors/**
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=addons/nuxeo-spreadsheet/app/ui/spreadsheet.js

# Suppress all issues in CI workflow files — npm install with preinstall scripts is intentional.
# TODO: Remove once sub-packages have package-lock.json and npm ci can be used safely.
# When re-enabling, add e4 to the sonar.issue.ignore.multicriteria list above (comma-separated).
# sonar.issue.ignore.multicriteria.e4.ruleKey=*
# sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/**