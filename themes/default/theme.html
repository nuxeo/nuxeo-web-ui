<!-- Import Satori Design Tokens -->
<link rel="stylesheet" href="../satori-design-tokens.css" />
<custom-style>
  <style is="custom-style">
    html {
      /* -- Nuxeo Branding colors -- */
      --nuxeo-app-font: 'Noto Sans';
      --nuxeo-text-default: #1a1c1e;

      --nuxeo-primary-color: #5654ac;
      --nuxeo-secondary-color: #5c5b7f;

      --nuxeo-page-background: #f5f5f5;
      --nuxeo-border: rgba(0, 0, 0, 0.15);

      /* App Header */
      --nuxeo-app-header: var(--nuxeo-text-default);
      --nuxeo-app-header-background: #fff;
      --nuxeo-app-header-pill: #ecf3f7;
      --nuxeo-app-header-pill-hover: var(--nuxeo-secondary-color);
      --nuxeo-app-header-pill-active: var(--nuxeo-primary-color);

      /* App Sidebar + Drawer*/
      --nuxeo-sidebar-background: var(--nuxeo-primary-color);
      --nuxeo-sidebar-menu: #ffffff;
      --nuxeo-sidebar-menu-hover: #ffffff;
      --nuxeo-badge-background: #fb6107;
      --nuxeo-drawer-header: var(--nuxeo-text-default);
      --nuxeo-drawer-text: var(--nuxeo-text-default);
      --nuxeo-drawer-background: #f4f3f7;
      --nuxeo-resize-handle-color: #989898;

      /* App Quick Search */
      --nuxeo-quicksearch-text: var(--nuxeo-text-default);
      --nuxeo-quicksearch-background: #fff;

      /* Tags & Pills */
      --nuxeo-tag-background: rgba(0, 0, 0, 0.05);
      --nuxeo-tag-text: var(--nuxeo-text-default);
      --nuxeo-pill-filter-background: rgba(0, 0, 0, 0.05);
      --nuxeo-pill-filter-background-active: var(--nuxeo-secondary-color);

      /* Boxes, Tables & Listings */
      --nuxeo-box: #fff;
      --nuxeo-table-header-background: #fff;
      --nuxeo-table-items-background: #ffffff;
      --nuxeo-grid-selected: var(--nuxeo-primary-color);
      --nuxeo-dropdown-list-background: #fff;

      /* Buttons & Links */
      --nuxeo-button: transparent;
      --nuxeo-button-primary: var(--nuxeo-primary-color);
      --nuxeo-button-primary-focus: var(--nuxeo-secondary-color);
      --nuxeo-button-primary-text: #ffffff;
      --nuxeo-button-secondary-text: var(--nuxeo-primary-color); /* Satori primary */
      --nuxeo-button-disabled: rgba(8, 8, 8, 0.148);
      --nuxeo-button-disabled-text: rgba(0, 0, 0, 0.139);
      --nuxeo-link-color: var(--nuxeo-text-default);
      --nuxeo-link-hover-color: var(--nuxeo-primary-color);

      --nuxeo-button-icon-margin: 4px;

      /* Custom Backgrounds */
      --nuxeo-container-hover: var(--nuxeo-page-background);
      --nuxeo-dialog-buttons-bar: transparent;
      --input-background: rgba(0, 0, 0, 0.05);

      /* Warn, Info, Error */
      --nuxeo-action-color-activated: var(--nuxeo-primary-color);
      --nuxeo-warn-text: #de350b;
      --nuxeo-validated: #42be65;
      --nuxeo-result-highlight: var(--nuxeo-primary-color);

      /* Selection toolbar */
      --nuxeo-selection-toolbar-background: var(--nuxeo-primary-color);
      --nuxeo-selection-toolbar-text: #fff;
      --nuxeo-selection-toolbar-link: #fff;
      --nuxeo-selection-toolbar-link-hover: #66ffff;

      /*-- Polymer Variables --*/
      --default-primary-color: var(--nuxeo-primary-color);
      --dark-primary-color: #213f7d;
      --light-primary-color: #eff2f4;
      --text-primary-color: #ffffff;
      --accent-color: var(--nuxeo-primary-color);
      --primary-background-color: #eff2f4;
      --primary-text-color: #243238;
      --secondary-text-color: #939caa;
      --disabled-text-color: #757575;
      --divider-color: var(--nuxeo-border);

      /* Tabs, Toolbars & Menus */
      --paper-tabs-selection-bar-color: var(--nuxeo-primary-color);
      --paper-tab-ink: var(--nuxeo-primary-color);

      --paper-toolbar-background: var(--nuxeo-box);
      --paper-toolbar-color: var(--nuxeo-text-default);

      --paper-listbox-background-color: var(--nuxeo-box);
      --paper-menu-background-color: var(--nuxeo-box);
      --paper-menu-color: var(--nuxeo-text-default);
      --paper-menu-disabled-color: #e9eff3;

      /* Forms & Buttons */
      --paper-checkbox-checked-color: var(--nuxeo-primary-color);
      --paper-checkbox-checked-ink-color: var(--nuxeo-primary-color);
      --paper-checkbox-unchecked-color: var(--nuxeo-text-default);
      --paper-checkbox-unchecked-ink-color: #6c6f7c;
      --paper-checkbox-label-color: var(--nuxeo-text-default);

      --paper-radio-button-checked-color: var(--nuxeo-primary-color);
      --paper-radio-button-checked-ink-color: #ffffff;
      --paper-radio-button-unchecked-color: var(--nuxeo-text-default);
      --paper-radio-button-unchecked-ink-color: #6c6f7c;
      --paper-radio-button-label-color: var(--nuxeo-text-default);

      --paper-input-container-color: var(--nuxeo-text-default);
      --paper-input-container-focus-color: var(--nuxeo-primary-color);
      --paper-input-container-focus-background-color: #0066ff1a;
      --paper-input-container-invalid-color: #de350b;
      --paper-input-container-input-color: var(--nuxeo-text-default);

      --paper-slider-knob-color: var(--nuxeo-primary-color);
      --paper-slider-active-color: var(--nuxeo-primary-color);
      --paper-slider-pin-color: var(--nuxeo-primary-color);

      --paper-toggle-button-checked-bar-color: var(--nuxeo-primary-color);
      --paper-toggle-button-checked-button-color: var(--nuxeo-primary-color);
      --paper-toggle-button-checked-ink-color: var(--nuxeo-primary-color);
      --paper-toggle-button-unchecked-bar-color: #6c6f7c;
      --paper-toggle-button-unchecked-button-color: #6c6f7c;
      --paper-toggle-button-unchecked-ink-color: #6c6f7c;

      --paper-fab-background: var(--nuxeo-primary-color);
      --paper-fab-disabled-background: #e9eff3;
      --paper-fab-disabled-text: #2f2b16;
      --paper-icon-button-disabled-text: #e9eff3;

      /* Loaders */
      --paper-progress-active-color: var(--nuxeo-primary-color);
      --paper-progress-secondary-color: var(--nuxeo-primary-color);

      --paper-spinner-layer-1-color: var(--nuxeo-primary-color);
      --paper-spinner-layer-2-color: rgba(79, 230, 221, 0.8);
      --paper-spinner-layer-3-color: #1f28bf;
      --paper-spinner-layer-4-color: var(--nuxeo-primary-color);

      /* Diff */
      --nuxeo-diff-added-color: #b4efcb;
      --nuxeo-diff-deleted-color: #e6b1b1;
      --nuxeo-diff-label-color: #d4d4d9;

      /* ================================================================
         TIER 3 — NUXEO COMPONENT TOKENS (--sat-<component>-<property>)
         Pattern: full words, no abbreviations, no -default suffixes.
         ================================================================ */

      /* Section header (used by home, clipboard, tasks, collections,
         recent docs, document tree — applied via the --sat-section-header mixin) */
      --sat-section-header-text-color: #474551;

      /* App / page-level header bar */
      --sat-app-header-background: #f4f3f7;
      --sat-app-header-shadow: none;
      --sat-page-surface-background: #f4f3f7;

      /* Drawer + Sidebar content */
      --sat-selection-pill-background: #e2dfff;
      --sat-drawer-toggle-handle-background: #c8c5d3;
      --sat-sidebar-item-selected-background: rgba(255, 255, 255, 0.12);
      --sat-sidebar-item-hover-background: rgba(255, 255, 255, 0.12);

      /* Document create button (FAB on the home dashboard) */
      --sat-document-create-button-icon-color: #3e3b92;
      --sat-document-create-button-background: #e2dfff;
      --sat-document-create-button-hover-background: #b6b0f1;
      --sat-document-create-button-box-shadow: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px rgba(0, 0, 0, 0.3);

      /* Document create shortcuts (labelled mini-buttons that expand from the FAB) */
      --sat-document-create-shortcut-label-color: #3e3b92;
      --sat-document-create-shortcut-icon-color: #3e3b92;

      /* Document view tabs */
      --sat-page-tabs-background: #f4f4f4;
      --sat-page-tabs-selected-background: #dadadd;
      --sat-page-tabs-active-text-color: #3e3b92;

      /* Results view mode toggle (segmented button) */
      --sat-view-toggle-outline: #777683;
      --sat-view-toggle-selected-background: #e2dfff;
      --sat-view-toggle-selected-icon-color: #1a1c1e;
      --sat-view-toggle-unselected-icon-color: #1a1c1e;
      --sat-view-toggle-unselected-background: transparent;
      --sat-view-toggle-check-color: #3e3b92;
      --sat-view-toggle-hover-background: rgba(85, 84, 172, 0.538);
      --sat-view-toggle-hover-icon-color: var(--nuxeo-primary-color);

      /* Nuxeo Elements - Map to Satori colors */
      --nuxeo-checkmark-border-color: #474551;
      --sat-tooltip-text-color: #ffffff;
      --sat-document-grid-thumbnail-background: var(--nuxeo-box);
      --sat-nuxeo-card-background: var(--nuxeo-box);
    }
  </style>
</custom-style>
